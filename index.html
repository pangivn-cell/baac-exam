<script>
/* เว็บจริงถูกแคชไว้ในเบราว์เซอร์ได้ · ต้องเปลี่ยน BUILD ทุกครั้งที่อัปเดตเว็บ (ใช้ sh bump.sh <เวอร์ชัน>) */
const BUILD='2026-10-29f';window.APP_VERSION=BUILD;
const APP_VER='2.1';window.APP_VER=APP_VER;   /* เวอร์ชันที่ผู้ใช้เห็น (เปลี่ยนพร้อม BUILD ด้วย sh bump.sh <build> <appver>) */
/* ไม่รีเฟรชหน้าเองอีกต่อไป: หน้าเว็บที่เปิดอยู่มีข้อสอบ/ไฟล์ที่กำลังทำค้างได้ ถ้าเจอเวอร์ชันใหม่จะขึ้นแถบให้กดรีเฟรชเอง */
(function(){
  if(!/github\.io$/.test(location.hostname))return;
  const DKEY='exam-build-notice';let last=0;
  function show(v){
    try{if(sessionStorage.getItem(DKEY)===v)return}catch(e){}
    if(document.getElementById('buildnote'))return;
    const el=document.createElement('div');el.id='buildnote';el.className='buildnote';el.setAttribute('role','status');
    el.innerHTML='<span>มีเวอร์ชันใหม่ <b>'+v+'</b></span><button type="button" id="buildnow">รีเฟรชตอนนี้</button><button type="button" id="buildx" aria-label="ปิดการแจ้งเตือน">✕</button>';
    document.body.appendChild(el);
    el.querySelector('#buildnow').onclick=()=>location.replace(location.pathname+'?v='+encodeURIComponent(v)+location.hash);
    el.querySelector('#buildx').onclick=()=>{try{sessionStorage.setItem(DKEY,v)}catch(e){}el.remove()};
  }
  function check(force){
    if(document.hidden)return;
    const now=Date.now();if(!force&&now-last<5*60000)return;last=now;
    fetch(location.pathname+'?chk='+now,{cache:'no-store'}).then(r=>r.ok?r.text():'').then(t=>{
      const m=t.match(/const BUILD='([^']+)'/);if(!m||m[1]===BUILD)return;
      if(String(m[1])>String(BUILD))show(m[1]);   /* แจ้งเฉพาะเวอร์ชันที่ใหม่กว่า กันเด้งกลับเวอร์ชันเก่าเป็นวงจร */
    }).catch(()=>{});
  }
  setTimeout(()=>check(true),5000);
  setInterval(check,15*60000);
  document.addEventListener('visibilitychange',()=>{if(!document.hidden)check(false)});
})();
</script>
