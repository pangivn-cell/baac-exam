<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>ระบบซ้อมสอบ</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anuphan:wght@500;600&family=Sarabun:wght@400;500;600&display=swap">
<style>
/* Layout: left rail (subjects + settings) beside one exam-sheet column; rail becomes a top strip on phones */
:root{
  --paper:#f3f5f8; --sheet:#ffffff; --rail:#e9edf4; --ink:#1c2538; --ink-2:#56607a; --line:#d9dee8;
  --accent:#2f47b8; --accent-soft:#e6eafb;
  --ok:#1f7a4d; --ok-soft:#e3f3ea; --bad:#b3322b; --bad-soft:#f9e5e3; --unk:#9a6206; --unk-soft:#fbf0dc;
  --mark:#c47a12;
  --cube-t:#e4e9f7; --cube-l:#b9c4e8; --cube-r:#8d9cd3; --paper-c:#fdf6e3;
  --f-display:"Anuphan","Sarabun",system-ui,sans-serif;
  --f-body:"Sarabun",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#11151f; --sheet:#1a2030; --rail:#151a27; --ink:#e7ebf4; --ink-2:#a2abc2; --line:#2e3750;
  --accent:#8fa2ff; --accent-soft:#252f52;
  --ok:#6fd3a0; --ok-soft:#173527; --bad:#ff8f86; --bad-soft:#3a1c1b; --unk:#f0bf63; --unk-soft:#3a2c12;
  --mark:#f0bf63; --cube-t:#5a6aa3; --cube-l:#3c4a7c; --cube-r:#283358; --paper-c:#3b3626; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#11151f; --sheet:#1a2030; --rail:#151a27; --ink:#e7ebf4; --ink-2:#a2abc2; --line:#2e3750;
  --accent:#8fa2ff; --accent-soft:#252f52;
  --ok:#6fd3a0; --ok-soft:#173527; --bad:#ff8f86; --bad-soft:#3a1c1b; --unk:#f0bf63; --unk-soft:#3a2c12;
  --mark:#f0bf63; --cube-t:#5a6aa3; --cube-l:#3c4a7c; --cube-r:#283358; --paper-c:#3b3626; color-scheme:dark}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.6}
button,select,textarea{font-family:var(--f-body)}
.app{display:grid;grid-template-columns:250px minmax(0,1fr);min-height:100vh}
.side{background:var(--rail);border-right:1px solid var(--line);padding-block:20px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:16px;display:flex;flex-direction:column;gap:18px;position:sticky;top:env(safe-area-inset-top,0px);align-self:start;height:100vh;box-sizing:border-box;overflow-y:auto}
.brand{font-family:var(--f-display);font-weight:600;font-size:1.35rem;margin:0}
.brand small{display:block;font:400 13px var(--f-body);color:var(--ink-2)}
.cap{font-size:12px;letter-spacing:.06em;color:var(--ink-2);margin:0 0 6px}
nav.subjects{display:flex;flex-direction:column;gap:4px}
.subj{display:flex;justify-content:space-between;align-items:center;gap:8px;text-align:left;font:500 15px var(--f-body);padding:9px 10px;border-radius:10px;border:1px solid transparent;background:transparent;color:var(--ink);cursor:pointer}
.subj:hover{background:var(--sheet)}
.subj[aria-current="true"]{background:var(--sheet);border-color:var(--accent);color:var(--accent)}
.lv{font:600 12px var(--f-body);padding:2px 8px;border-radius:999px;background:var(--accent-soft);color:var(--accent);white-space:nowrap;font-variant-numeric:tabular-nums}
.set{display:flex;flex-direction:column;gap:12px}
.field{display:flex;flex-direction:column;gap:4px}
.field label,.field .fl{font-size:14px;color:var(--ink-2)}
input.tx,select{font-size:15px;box-sizing:border-box;width:100%;padding:7px 8px;border-radius:8px;border:1px solid var(--line);background:var(--sheet);color:var(--ink)}
.seg{display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{font:500 14px var(--f-body);padding:8px 4px;border:none;background:var(--sheet);color:var(--ink);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--sheet)}
.aiset{border-top:1px solid var(--line);padding-top:12px}
.aiset summary{cursor:pointer;font-weight:600;font-size:15px;display:flex;justify-content:space-between;gap:8px}
.aiset .bd{display:flex;flex-direction:column;gap:10px;padding-top:10px}
.aiset .hint{font-size:13px;color:var(--ink-2);margin:0;line-height:1.5}
.aiset .ok{color:var(--ok)} .aiset .err{color:var(--bad)}
.aiset .btns{display:flex;gap:6px;flex-wrap:wrap}
.klink{font-size:13px;color:var(--accent);text-decoration:none;align-self:flex-start}
.klink:hover{text-decoration:underline}
.howto{border:1px solid var(--line);border-radius:10px;padding:8px 10px;background:var(--sheet)}
.howto summary{cursor:pointer;font-size:14px;font-weight:600}
.howto ol{margin:8px 0 4px;padding-left:20px;display:flex;flex-direction:column;gap:4px;font-size:13px;line-height:1.55}
.howto a{color:var(--accent);overflow-wrap:anywhere}
.pill{font:600 12px var(--f-body);padding:2px 8px;border-radius:999px;background:var(--accent-soft);color:var(--accent);white-space:nowrap}
.primary{font:600 15px var(--f-body);padding:10px 14px;border-radius:10px;border:none;background:var(--accent);color:var(--sheet);cursor:pointer}
.primary:disabled{opacity:.5;cursor:default}
.ghost{font:500 13px var(--f-body);padding:6px 10px;border-radius:8px;border:1px solid var(--line);background:transparent;color:var(--ink-2);cursor:pointer}
.main{padding-block:24px 56px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));min-width:0}
.col{max-width:720px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.head{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
.head h1{font-family:var(--f-display);font-weight:600;font-size:1.5rem;margin:0;text-wrap:balance}
.head p{margin:0;color:var(--ink-2);font-size:14px}
.sheet{background:var(--sheet);border:1px solid var(--line);border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:14px;min-width:0}
.meta{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:14px;color:var(--ink-2);font-variant-numeric:tabular-nums}
.bar{height:6px;background:var(--line);border-radius:99px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--accent);transition:width .3s}
.given{display:grid;grid-template-columns:auto 1fr;column-gap:12px;row-gap:2px;font-size:1.15rem;align-items:baseline;overflow-x:auto}
.given .k{color:var(--ink-2);font-size:15px}
.given .eq{font-weight:500;white-space:nowrap}
.given .note{grid-column:2;color:var(--ink-2);font-size:14px}
.ask{border-top:1px dashed var(--line);padding-top:12px}
.ask .lab{font-size:14px;color:var(--ink-2)}
.ask .st2{font-family:var(--f-display);font-weight:600;font-size:1.15rem}
.ask .st{font-family:var(--f-display);font-weight:600;font-size:1.5rem;white-space:nowrap;overflow-x:auto}
.stem{white-space:pre-wrap;font-size:1.1rem;overflow-wrap:anywhere}
.choices{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.choices.mc{grid-template-columns:1fr}
.ch{font:600 16px var(--f-body);padding:12px 10px;border-radius:10px;border:1.5px solid var(--line);background:var(--sheet);color:var(--ink);cursor:pointer;text-align:center}
.choices.mc .ch{text-align:left;font-weight:500;display:flex;gap:10px;align-items:baseline}
.choices.mc .ch b{color:var(--accent);min-width:1.2em}
.ch:hover:not(:disabled){border-color:var(--accent)}
.ch.sel{border-color:var(--accent);background:var(--accent-soft)}
.ch:disabled{cursor:default}
.ch.right{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}
.qsvgw{margin:0;display:flex;flex-wrap:wrap;gap:8px 6px;align-items:center;justify-content:center;padding:12px 8px;border:1px solid var(--line);border-radius:10px;background:var(--sheet)}
.qsvg{display:block;max-width:100%;height:auto}
.qsvg .s{stroke:var(--ink);stroke-width:1.5;stroke-linejoin:round;stroke-linecap:round}
.qsvg .ln{fill:none} .qsvg .ft{fill:var(--cube-t)} .qsvg .fl{fill:var(--cube-l)} .qsvg .fr{fill:var(--cube-r)} .qsvg .pp{fill:var(--paper-c)}
.qsvg .ink{fill:var(--ink)} .qsvg .sym{fill:none;stroke:var(--ink);stroke-width:2.4} .qsvg .shade{fill:var(--cube-l)}
.qsvg .acc{stroke:var(--accent);stroke-width:2} .qsvg .accf{fill:var(--accent)} .qsvg .dash{stroke-dasharray:4 3}
.qsvg .gr{fill:none;stroke:var(--ink-2);stroke-width:.6;opacity:.45}
.qsvg .tx{fill:var(--ink);font:600 15px var(--f-body);text-anchor:middle;dominant-baseline:central} .qsvg .tx.big{font-size:20px} .qsvg .tx.sm{font-size:11px;font-weight:500;fill:var(--ink-2)}
.qarrow{color:var(--ink-2);font-size:18px}
.choices.pics{grid-template-columns:1fr 1fr}
.choices.mc.pics .ch{align-items:center;justify-content:flex-start;gap:8px;padding:8px}
.chsvg{flex:1;display:flex;justify-content:center;min-width:0}
.ch.right .chsvg,.ch.wrong .chsvg{background:var(--sheet);border-radius:6px}
.ch.wrong{background:var(--bad-soft);border-color:var(--bad);color:var(--bad);text-decoration:line-through}
:is(.ch,.subj,.seg button,.primary,.ghost,.qk,.send,.stop,select,textarea,summary):focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.verdict{font-family:var(--f-display);font-weight:600;font-size:1.1rem;margin:0}
.verdict.good{color:var(--ok)} .verdict.bad{color:var(--bad)}
.explain{display:flex;flex-direction:column;gap:10px}
.lbl{font-size:13px;color:var(--ink-2);margin:0;letter-spacing:.02em}
.row{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.chip{border:1px solid var(--line);background:var(--accent-soft);color:var(--ink);border-radius:8px;padding:4px 10px;font-weight:600}
.chip.hl{outline:2px solid var(--mark);outline-offset:2px}
.chip.dim,.op.dim{opacity:.35}
.op{color:var(--ink-2);font-size:18px}
.op.hl{color:var(--mark);font-weight:600}
ol.steps{margin:0;padding-left:22px;display:flex;flex-direction:column;gap:6px}
.src{color:var(--ink-2);font-size:13px}
.navrow{display:flex;justify-content:space-between;align-items:center;gap:8px}
.state{display:flex;flex-direction:column;gap:12px;align-items:center;text-align:center;padding-block:28px}
.state p{margin:0;max-width:44ch}
.spin{width:36px;height:36px;border-radius:50%;border:3px solid var(--line);border-top-color:var(--accent);animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.result{display:flex;flex-direction:column;gap:12px;align-items:center;text-align:center}
.sticker{font-size:72px;line-height:1;width:120px;height:120px;display:grid;place-items:center;border-radius:50%;background:var(--accent-soft);border:3px solid var(--sheet);box-shadow:0 0 0 2px var(--line)}
.sticker.good{background:var(--ok-soft)} .sticker.mid{background:var(--unk-soft)} .sticker.bad{background:var(--bad-soft)}
@media (prefers-reduced-motion:no-preference){.sticker{animation:pop .6s cubic-bezier(.2,1.6,.4,1)}}
@keyframes pop{from{transform:scale(.4) rotate(-12deg)}to{transform:none}}
.big{font-family:var(--f-display);font-size:2.6rem;font-weight:600;font-variant-numeric:tabular-nums;margin:0}
.msgt{font-family:var(--f-display);font-weight:600;font-size:1.3rem;margin:0}
.lvchg{font-size:14px;padding:4px 12px;border-radius:999px;background:var(--accent-soft);color:var(--accent)}
.review{width:100%;text-align:left;display:flex;flex-direction:column;gap:8px}
.review details{border:1px solid var(--line);border-radius:10px;padding:8px 12px}
.review summary{cursor:pointer;display:flex;justify-content:space-between;gap:8px}
.review summary span:first-child{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.review .x{color:var(--bad);white-space:nowrap} .review .o{color:var(--ok);white-space:nowrap}
.review .body{display:flex;flex-direction:column;gap:10px;padding-top:10px}
.askbox{border-top:1px dashed var(--line);padding-top:12px;display:flex;flex-direction:column;gap:8px}
.quick{display:flex;flex-wrap:wrap;gap:6px}
.qk{font:500 14px var(--f-body);padding:6px 12px;border-radius:999px;border:1px solid var(--accent);background:var(--accent-soft);color:var(--accent);cursor:pointer}
.thread{display:flex;flex-direction:column;gap:8px}
.msg{padding:8px 12px;border-radius:12px;white-space:pre-wrap;max-width:92%;min-width:0;overflow-wrap:anywhere;line-height:1.65}
.msg.me{align-self:flex-end;background:var(--accent);color:var(--sheet)}
.msg.ai{align-self:flex-start;background:var(--paper);border:1px solid var(--line)}
.msg.wait{color:var(--ink-2);font-style:italic}
.askform{display:flex;flex-direction:column;gap:8px;margin:0}
.askform textarea{width:100%;box-sizing:border-box;font-size:16px;padding:8px 10px;border-radius:10px;border:1px solid var(--line);background:var(--paper);color:var(--ink);resize:vertical}
.askrow{display:flex;gap:8px;align-items:center;justify-content:flex-end}
.asknote{flex:1;min-width:0;font-size:13px;color:var(--ink-2)}
.send,.stop{font:600 15px var(--f-body);padding:8px 16px;border-radius:10px;cursor:pointer}
.send{border:none;background:var(--accent);color:var(--sheet)}
.send:disabled{opacity:.5;cursor:default}
.stop{border:1px solid var(--line);background:var(--sheet);color:var(--ink)}
.nge{position:relative;display:inline-block}
.nge::after{content:"";position:absolute;left:50%;top:12%;bottom:12%;border-left:1.6px solid currentColor;transform:translateX(-50%) rotate(22deg)}
/* ---- views, mock exam, history ---- */
[hidden]{display:none!important}
.views{display:flex;flex-direction:column;gap:4px}
#pside{display:flex;flex-direction:column;gap:18px}
#pside.off .subj[aria-current="true"]{background:transparent;border-color:transparent;color:var(--ink)}
.app.exam{grid-template-columns:1fr}
.app.exam .side{display:none}
.tbar{position:sticky;top:8px;z-index:5;display:flex;align-items:center;gap:8px 14px;flex-wrap:wrap;background:var(--sheet);border:1px solid var(--line);border-radius:14px;padding:10px 14px;box-shadow:0 4px 14px rgba(0,0,0,.08)}
.clock{font:600 1.5rem var(--f-display);font-variant-numeric:tabular-nums;margin-right:auto}
.clock.warn{color:var(--unk)} .clock.bad{color:var(--bad)}
.tmeta{font-size:14px;color:var(--ink-2);font-variant-numeric:tabular-nums}
.tmeta.bad{color:var(--bad);font-weight:600}
.pal{display:grid;grid-template-columns:repeat(auto-fill,minmax(42px,1fr));gap:6px}
.pn{font:600 14px var(--f-body);padding:6px 0;border-radius:8px;border:1px solid var(--line);background:var(--sheet);color:var(--ink);cursor:pointer;font-variant-numeric:tabular-nums}
.pn.done{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.pn.cur{outline:2px solid var(--mark);outline-offset:1px}
.pn:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.form{display:flex;flex-direction:column;gap:14px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
fieldset.cheat{border:1px solid var(--line);border-radius:10px;padding:10px 14px;margin:0;display:flex;flex-direction:column;gap:10px;min-width:0}
fieldset.cheat legend{font-weight:600;padding:0 6px}
fieldset.cheat p{margin:0}
.catnote{margin:0;font-size:14px;color:var(--ink-2)}
.catnote.warn{color:var(--unk)}
.rules{text-align:left;margin:0;padding-left:20px;display:flex;flex-direction:column;gap:4px;max-width:52ch}
.scorebox{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;width:100%}
.scorebox>div{border:1px solid var(--line);border-radius:12px;padding:10px 6px;background:var(--paper)}
.scorebox .big{font-size:2rem}
.scorebox p{margin:0}
.g-A,.g-B{color:var(--ok)} .g-C,.g-D{color:var(--unk)} .g-F{color:var(--bad)}
.autonote{margin:0;padding:6px 14px;border-radius:999px;background:var(--bad-soft);color:var(--bad);font-size:14px}
.anal{width:100%;text-align:left;display:flex;flex-direction:column;gap:8px}
.brow{display:grid;grid-template-columns:minmax(0,10em) 1fr auto;gap:10px;align-items:center;font-size:14px}
.brow>span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.brow .bar{height:10px}
.brow .bar>i.ok{background:var(--ok)} .brow .bar>i.mid{background:var(--unk)} .brow .bar>i.bad{background:var(--bad)}
.brow .v{font-variant-numeric:tabular-nums;color:var(--ink-2);white-space:nowrap}
.sw{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:100%;text-align:left}
.sw>div{border-radius:12px;padding:10px 14px}
.sw .s{background:var(--ok-soft)} .sw .w{background:var(--bad-soft)}
.sw p{margin:0}
.vlog{width:100%;text-align:left;font-size:14px}
.vlog ol{margin:6px 0 0;padding-left:22px}
.btnrow{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.revhead{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.revhead label{font-size:14px;color:var(--ink-2);display:flex;gap:6px;align-items:center}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.tile{border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--paper);font-size:13px;color:var(--ink-2)}
.tile b{display:block;font:600 1.6rem var(--f-display);color:var(--ink);font-variant-numeric:tabular-nums}
.hlist{display:flex;flex-direction:column;gap:8px}
.hrow{display:flex;justify-content:space-between;gap:12px;align-items:center;border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.hrow .t{display:flex;flex-direction:column;gap:2px;min-width:0}
.hp{font:600 1.3rem var(--f-display);text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.hp small{display:block;font:400 12px var(--f-body);color:var(--ink-2)}
.badge{display:inline-block;font-size:12px;padding:1px 8px;border-radius:999px;background:var(--bad-soft);color:var(--bad);margin-right:4px}
.badge.m{background:var(--accent-soft);color:var(--accent)}
.toast{position:fixed;left:50%;top:16px;transform:translate(-50%,-160%);z-index:50;padding:10px 18px;border-radius:12px;background:var(--ink);color:var(--sheet);font-weight:600;box-shadow:0 6px 20px rgba(0,0,0,.2);transition:transform .25s;max-width:calc(100vw - 32px);box-sizing:border-box;text-align:center}
.toast.show{transform:translate(-50%,0)}
.toast.warn{background:var(--unk);color:var(--sheet)} .toast.bad{background:var(--bad);color:var(--sheet)}
dialog#dlg{border:1px solid var(--line);border-radius:14px;background:var(--sheet);color:var(--ink);padding:18px;width:min(420px,calc(100vw - 32px));box-sizing:border-box}
dialog#dlg::backdrop{background:rgba(0,0,0,.45)}
.dlgb{display:flex;flex-direction:column;gap:8px}
.dlgb p{margin:0}
.mt{font:600 1.2rem var(--f-display)}
.dlgbtns{display:flex;gap:8px;justify-content:flex-end;margin-top:8px;flex-wrap:wrap}
@media (max-width:520px){.grid2,.sw{grid-template-columns:1fr}.tiles{grid-template-columns:1fr 1fr}.scorebox .big{font-size:1.6rem}.brow{grid-template-columns:minmax(0,7em) 1fr auto}}
@media (prefers-reduced-motion:reduce){.toast{transition:none}}
nav.subjects{gap:14px}
.sgrp .cap{margin-bottom:4px}
.slist{display:flex;flex-direction:column;gap:4px}
.subj .sn{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dd{display:flex;flex-direction:column;gap:6px}
.ddbtn{gap:6px}
.ddbtn .sn{flex:1;text-align:left}
.ddbtn .caret{color:var(--ink-2);transition:transform .2s}
.ddbtn[aria-expanded="true"] .caret{transform:rotate(180deg)}
.ddpanel{display:flex;flex-direction:column;gap:6px;border:1px solid var(--line);border-radius:10px;padding:8px;background:var(--sheet)}
.ddlist{display:flex;flex-direction:column;gap:2px;max-height:340px;overflow:auto}
.ddpanel .src{margin:0;padding:4px}
.ufs{border:1px solid var(--line);border-radius:10px;margin:0;padding:8px 12px;display:flex;flex-direction:column;gap:8px;min-width:0}
.ufs legend{font-weight:600;padding:0 4px}
.rad{display:flex;gap:8px;align-items:flex-start;cursor:pointer}
.rad>span{display:flex;flex-direction:column}

const ILV={1:{d:'e',k:[2]},2:{d:'em',k:[2]},3:{d:'emh',k:[2,3]},4:{d:'mhh',k:[3,4]},5:{d:'hhm',k:[4,5]}};
function ctxFor(k){const L=shuffle('ABCDEFGHJKLMNPQRSTUVWXYZ'.split('')).slice(0,7);return{X:L[0],Y:L[1],Q:L[2],H:L[3],M:L[4],R:L[5],S:L[6],k}}
function genIneq(level,n){
  const cfg=ILV[level];const out=[];let last=-1;
  for(let i=0;i<n;i++){
    const d=rnd(cfg.d.split(''));let pool=TPL.map((t,j)=>j).filter(j=>TPL[j].d===d&&j!==last);
    const j=rnd(pool);last=j;const ctx=ctxFor(rnd(cfg.k));const q=TPL[j].f(ctx);
    out.push({kind:'ineq',ctx,text:q.text,hl:q.hl,steps:q.steps,choices:TFU.map(a=>LBL[a]),answer:TFU.indexOf(q.ans)});
  }
  return out;
}

/* LP feasibility (phase-1 simplex, Bland's rule). rows: {a:[...n], b, t:'ge'|'eq'} meaning a·x >= b or a·x = b, x >= 0 */
function lpFeasible(rows,n){
  const m=rows.length,ns=rows.filter(r=>r.t==='ge').length,N=n+ns+m,T=[],basis=[];
  let si=n;
  rows.forEach((r,i)=>{const row=new Array(N+1).fill(0);for(let j=0;j<n;j++)row[j]=r.a[j]||0;if(r.t==='ge'){row[si]=-1;si++}row[N]=r.b;
    if(row[N]<0)for(let k=0;k<=N;k++)row[k]=-row[k];row[n+ns+i]=1;T.push(row);basis.push(n+ns+i)});
  const z=new Array(N+1).fill(0);
  for(let j=0;j<n+ns;j++){let s=0;for(let i=0;i<m;i++)s+=T[i][j];z[j]=-s}
  {let s=0;for(let i=0;i<m;i++)s+=T[i][N];z[N]=-s}
  for(let it=0;it<800;it++){
    let j=-1;for(let k=0;k<N;k++)if(z[k]<-1e-9){j=k;break}
    if(j<0)break;
    let r=-1,best=Infinity;
    for(let i=0;i<m;i++)if(T[i][j]>1e-9){const q=T[i][N]/T[i][j];if(q<best-1e-12||(Math.abs(q-best)<=1e-12&&basis[i]<basis[r])){best=q;r=i}}
    if(r<0)break;
    const pv=T[r][j];for(let k=0;k<=N;k++)T[r][k]/=pv;
    for(let i=0;i<m;i++)if(i!==r&&Math.abs(T[i][j])>1e-12){const f=T[i][j];for(let k=0;k<=N;k++)T[i][k]-=f*T[r][k]}
    {const f=z[j];for(let k=0;k<=N;k++)z[k]-=f*T[r][k]}
    basis[r]=j;
  }
  return Math.abs(z[N])<1e-6;
}
const NEG={'>':'≤','<':'≥','≥':'<','≤':'>','=':'≠','≠':'=','≯':'>','≮':'<'};
function relRows(op,L,R,V){
  const d=V.map(v=>(L[v]||0)-(R[v]||0)),nd=d.map(x=>-x);
  switch(op){
    case '>':return[[{a:d,b:1,t:'ge'}]];case '<':return[[{a:nd,b:1,t:'ge'}]];
    case '≥':case '≮':return[[{a:d,b:0,t:'ge'}]];case '≤':case '≯':return[[{a:nd,b:0,t:'ge'}]];
    case '=':return[[{a:d,b:0,t:'eq'}]];case '≠':return[[{a:d,b:1,t:'ge'}],[{a:nd,b:1,t:'ge'}]];
  }
}
const SUMSEP='+';
function atomMap(at){const m={};if(at.node.includes(SUMSEP))for(const l of at.node.split(SUMSEP))m[l]=(m[l]||0)+at.k;else m[at.node]=at.k;return m}
function piecesMap(pcs){const m={};for(const p of pcs){const a=atomMap(p);for(const l in a)m[l]=(m[l]||0)+a[l]}return m}
function premRows(P,V){
  const rows=V.map((v,i)=>({a:V.map((_,j)=>j===i?1:0),b:1,t:'ge'}));
  for(const line of P.lines)for(let i=0;i<line.ops.length;i++)rows.push(...relRows(line.ops[i],atomMap(line.atoms[i]),atomMap(line.atoms[i+1]),V)[0]);
  return rows;
}
function possible(base,op,L,R,V){return relRows(op,L,R,V).some(alt=>lpFeasible([...base,...alt],V.length))}
function lpVerdict(base,op,L,R,V){
  if(!possible(base,NEG[op],L,R,V))return'T';
  if(!possible(base,op,L,R,V))return'F';
  return'U';
}

/* formatting */
function fmtK(k){

const ri=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const r2=x=>Math.round(x*100)/100;
const nf=x=>{x=r2(x);return Math.abs(x)>=1000?x.toLocaleString('en-US'):String(x)};
function mkMC(stem,ans,dist,steps,fmt){
  fmt=fmt||nf;const seen=new Set([fmt(ans)]),ds=[];
  for(const d of dist){if(d==null||!isFinite(d))continue;const s=fmt(d);if(!seen.has(s)){seen.add(s);ds.push(s)}if(ds.length===3)break}
  let k=1;while(ds.length<3){for(const d of [ans+k,ans-k]){const s=fmt(d);if(ds.length<3&&!seen.has(s)){seen.add(s);ds.push(s)}}k++}
  const choices=shuffle([fmt(ans),...ds]);return{kind:'mc',stem,choices,answer:choices.indexOf(fmt(ans)),steps};
}
function mkMCtext(stem,ans,dist,steps){const choices=shuffle([ans,...dist.slice(0,3)]);return{kind:'mc',stem,choices,answer:choices.indexOf(ans),steps}}
function many(fn,n){const out=[],seen=new Set();let guard=0;while(out.length<n&&guard++<n*40){const q=fn(),k=q&&q.stem+(q.svg||'');if(q&&!seen.has(k)){seen.add(k);out.push(q)}}return out}

/* ---------- อนุกรม ---------- */
const PRIMES=[2,3,5,7,11,13,17];
const SER_POOL={1:['ar','geo'],2:['ar','geo','sq'],3:['d2','fib','inter','aff','sq'],4:['inter','alt','dgeo','d2','cube'],5:['alt','dgeo','fact','prime','inter','aff']};
function serRule(kind,level){
  const t=[];let rule,calc;
  switch(kind){
    case 'ar':{const a=ri(1,20)+(level>1?ri(0,30):0),d=level===1?ri(2,9):rnd([-7,-6,-5,-4,4,5,6,7,8,9,11,12]);for(let i=0;i<7;i++)t.push(a+i*d);
      rule=`ผลต่างของตัวที่ติดกันคงที่ แต่ละตัว${d>0?'บวก '+d:'ลบ '+(-d)}`;calc=i=>`${t[i-1]} ${d>0?'+ '+d:'− '+(-d)} = ${t[i]}`;break}
    case 'geo':{const a=ri(1,5),r=level===1?rnd([2,3]):rnd([2,3,4]);for(let i=0;i<7;i++)t.push(a*r**i);rule=`แต่ละตัวคูณ ${r}`;calc=i=>`${t[i-1]} × ${r} = ${t[i]}`;break}
    case 'sq':{const n0=ri(1,6),cc=level>=2?rnd([0,0,1,-1,2]):0;for(let i=0;i<7;i++)t.push((n0+i)**2+cc);
      rule=`เป็นกำลังสองเรียงกัน ${n0}², ${n0+1}², ${n0+2}², …${cc?` แล้ว${cc>0?'บวก '+cc:'ลบ '+(-cc)}`:''}`;calc=i=>`${n0+i}² ${cc?(cc>0?'+ '+cc:'− '+(-cc)):''} = ${t[i]}`;break}
    case 'd2':{const a=ri(1,15),d0=ri(1,5),e=ri(1,4);t.push(a);for(let i=1;i<7;i++)t.push(t[i-1]+d0+(i-1)*e);
      rule=`ผลต่างคือ ${d0}, ${d0+e}, ${d0+2*e}, … เพิ่มขึ้นทีละ ${e}`;calc=i=>`${t[i-1]} + ${d0+(i-1)*e} = ${t[i]}`;break}
    case 'fib':{t.push(ri(1,5),ri(1,6));for(let i=2;i<7;i++)t.push(t[i-1]+t[i-2]);rule='แต่ละตัวเท่ากับสองตัวก่อนหน้าบวกกัน';calc=i=>`${t[i-2]} + ${t[i-1]} = ${t[i]}`;break}
    case 'inter':{const a1=ri(1,20),d1=ri(2,7),a2=ri(20,60),d2=rnd([-5,-4,-3,3,4,5,6]);for(let i=0;i<7;i++)t.push(i%2===0?a1+(i/2)*d1:a2+((i-1)/2)*d2);
      rule=`แยกเป็น 2 ชุดสลับกัน ตำแหน่งคี่บวก ${d1} ทุกครั้ง ตำแหน่งคู่${d2>0?'บวก '+d2:'ลบ '+(-d2)} ทุกครั้ง`;calc=i=>{const d=i%2===0?d1:d2;return `${t[i-2]} ${d>0?'+ '+d:'− '+(-d)} = ${t[i]} (ดูตัวที่อยู่ห่างกัน 2 ตำแหน่ง)`};break}
    case 'aff':{const m=rnd([2,3]),cc=rnd([1,-1,2,3]);t.push(ri(2,5));for(let i=1;i<7;i++)t.push(t[i-1]*m+cc);
      rule=`แต่ละตัว = ตัวก่อนหน้า × ${m} ${cc>0?'+ '+cc:'− '+(-cc)}`;calc=i=>`${t[i-1]} × ${m} ${cc>0?'+ '+cc:'− '+(-cc)} = ${t[i]}`;break}
    case 'alt':{const p=ri(1,5),q=rnd([2,3]);t.push(ri(1,9));for(let i=1;i<7;i++)t.push(i%2===1?t[i-1]+p:t[i-1]*q);
      rule=`ทำสลับกัน บวก ${p} แล้วคูณ ${q} ไปเรื่อยๆ`;calc=i=>i%2===1?`${t[i-1]} + ${p} = ${t[i]}`:`${t[i-1]} × ${q} = ${t[i]}`;break}
    case 'dgeo':{const a=ri(1,10),d=ri(1,3),r=rnd([2,3]);t.push(a);for(let i=1;i<7;i++)t.push(t[i-1]+d*r**(i-1));
      rule=`ผลต่างคือ ${d}, ${d*r}, ${d*r*r}, … คูณ ${r} ทุกครั้ง`;calc=i=>`${t[i-1]} + ${d*r**(i-1)} = ${t[i]}`;break}
    case 'cube':{const n0=ri(1,4);for(let i=0;i<7;i++)t.push((n0+i)**3);rule=`เป็นกำลังสามเรียงกัน ${n0}³, ${n0+1}³, ${n0+2}³, …`;calc=i=>`${n0+i}³ = ${t[i]}`;break}
    case 'fact':{t.push(ri(1,3));for(let i=1;i<7;i++)t.push(t[i-1]*(i+1));rule='แต่ละตัวคูณด้วยเลขที่เพิ่มขึ้น × 2, × 3, × 4, …';calc=i=>`${t[i-1]} × ${i+1} = ${t[i]}`;break}
    case 'prime':{t.push(ri(1,20));for(let i=1;i<7;i++)t.push(t[i-1]+PRIMES[i-1]);rule='ผลต่างเป็นจำนวนเฉพาะเรียงกัน 2, 3, 5, 7, 11, …';calc=i=>`${t[i-1]} + ${PRIMES[i-1]} = ${t[i]}`;break}
  }
  return{t,rule,calc};
}
function genSeries1(level){
  const kind=rnd(SER_POOL[level]),{t,rule,calc}=serRule(kind,level);
  if(t.some(v=>Math.abs(v)>99999))return null;
  const missing=level>=4&&Math.random()<.35&&kind!=='fib';
  let shown,idx;
  if(missing){idx=ri(2,4);shown=t.slice(0,6).map((v,i)=>i===idx?'?':v)}else{idx=5;shown=[...t.slice(0,5),'?']}
  const ans=t[idx],prev=t[idx-1],pp=t[idx-2];
  const naive=prev+(prev-pp);
  return mkMC(`จงหาจำนวนที่แทน ?\n${shown.join(',  ')}`,ans,shuffle([naive,ans+(ans-prev),ans+1,ans-1,ans+2,ans-2]).sort((a,b)=>(b===naive)-(a===naive)),
    [[rule,'ดูความสัมพันธ์ของตัวที่ติดกัน'],[`จำนวนที่หายไป: ${calc(idx)}`,'ใช้กฎในข้อ 1']]);
}

/* ---------- คณิตศาสตร์ทั่วไป ---------- */
const MATH_POOL={1:['pct','disc','speed'],2:['pct','disc','profit','speed','ratio'],3:['profit','avg','ratio','work','interest'],4:['profit','age','work','updown','avg'],5:['age','updown','pctpct','work','profit']};
const WORK=[[3,6],[4,12],[6,12],[10,15],[12,24],[20,30],[12,4],[8,24],[5,20],[9,18],[15,10],[30,20]];
const pf=x=>nf(x)+'%',bf=x=>nf(x)+' บาท',df=x=>nf(x)+' วัน',yf=x=>nf(x)+' ปี',kf=x=>nf(x)+' กม.';
function genMath1(level){
  switch(rnd(MATH_POOL[level])){
    case 'pct':{const x=rnd([5,10,15,20,25,30,40,50,60,75]),N=20*ri(2,100),a=N*x/100;
      return mkMC(`${x}% ของ ${nf(N)} มีค่าเท่าใด`,a,[N*x/10,N*(100-x)/100,a+x],[[`${x}% คือ ${x} ส่วนใน 100`,'ความหมายของร้อยละ'],[`${nf(N)} × ${x} ÷ 100 = ${nf(a)}`,'ข้อ 1']])}
    case 'disc':{const P=100*ri(2,50),x=rnd([10,15,20,25,30,40]),off=P*x/100,a=P-off;
      return mkMC(`สินค้าราคา ${nf(P)} บาท ลดราคา ${x}% ต้องจ่ายกี่บาท`,a,[off,P-x,P+off],[[`ส่วนลด = ${nf(P)} × ${x} ÷ 100 = ${nf(off)} บาท`,'ร้อยละของราคาเต็ม'],[`จ่ายจริง = ${nf(P)} − ${nf(off)} = ${nf(a)} บาท`,'ราคาเต็มลบส่วนลด']],bf)}
    case 'profit':{const C=20*ri(5,50),p=rnd([10,20,25,30,40,50]),S=C*(100+p)/100;
      return mkMC(`ซื้อของมา ${nf(C)} บาท ขายไป ${nf(S)} บาท ได้กำไรกี่เปอร์เซ็นต์`,p,[(S-C)/S*100,p+10,p/2],[[`กำไร = ${nf(S)} − ${nf(C)} = ${nf(S-C)} บาท`,'ราคาขายลบราคาทุน'],[`คิดเป็นร้อยละของทุน = ${nf(S-C)} ÷ ${nf(C)} × 100 = ${p}%`,'กำไรขาดทุนคิดเทียบกับทุนเสมอ']],pf)}
    case 'speed':{const v=10*ri(4,10),t=rnd([1.5,2,2.5,3,4]),a=v*t;
      return mkMC(`รถวิ่งด้วยความเร็ว ${v} กม./ชม. เป็นเวลา ${t} ชั่วโมง ได้ระยะทางกี่กิโลเมตร`,a,[v/t,v+t,v*(t+1)],[['ระยะทาง = ความเร็ว × เวลา','สูตรความเร็ว'],[`${v} × ${t} = ${nf(a)} กม.`,'ข้อ 1']],kf)}
    case 'avg':{const m=ri(20,80),xs=[0,0,0,0].map(()=>ri(m-20,m+20)),s4=xs.reduce((a,b)=>a+b,0),a=5*m-s4;if(a<=0||a>200)return null;
      return mkMC(`ค่าเฉลี่ยของจำนวน 5 จำนวนเท่ากับ ${m} ถ้า 4 จำนวนแรกคือ ${xs.join(', ')} จำนวนที่ 5 คือเท่าใด`,a,[m,Math.round(s4/4),a+5],[[`ผลรวมทั้ง 5 จำนวน = ${m} × 5 = ${5*m}`,'ค่าเฉลี่ย × จำนวนตัว'],[`ผลรวม 4 จำนวนแรก = ${s4}`,'บวกจำนวนที่โจทย์ให้'],[`จำนวนที่ 5 = ${5*m} − ${s4} = ${a}`,'ข้อ 1 ลบข้อ 2']])}
    case 'ratio':{let a=ri(1,7),b=ri(1,7);if(a===b)b=a+1;const u=10*ri(2,30),T=(a+b)*u,ans=a*u;
      return mkMC(`แบ่งเงิน ${nf(T)} บาท ให้ ก และ ข ในอัตราส่วน ${a} : ${b} ก ได้เงินกี่บาท`,ans,[b*u,T/a,T*a/b],[[`รวมทั้งหมด ${a} + ${b} = ${a+b} ส่วน`,'บวกตัวเลขในอัตราส่วน'],[`1 ส่วน = ${nf(T)} ÷ ${a+b} = ${nf(u)} บาท`,'เงินทั้งหมดหารจำนวนส่วน'],[`ก ได้ ${a} ส่วน = ${a} × ${nf(u)} = ${nf(ans)} บาท`,'ข้อ 2']],bf)}
    case 'work':{const [a,b]=rnd(WORK),ans=a*b/(a+b);
      return mkMC(`ก ทำงานชิ้นหนึ่งเสร็จใน ${a} วัน ข ทำงานเดียวกันเสร็จใน ${b} วัน ถ้าช่วยกันทำจะเสร็จในกี่วัน`,ans,[(a+b)/2,a+b,Math.abs(a-b)],[[`ใน 1 วัน ก ทำได้ 1/${a} ของงาน ข ทำได้ 1/${b} ของงาน`,'ทำเสร็จใน n วัน = วันละ 1/n'],[`ช่วยกัน 1 วันได้ 1/${a} + 1/${b} = ${a+b}/${a*b} ของงาน`,'บวกเศษส่วน'],[`งานทั้งหมดเสร็จใน ${a*b} ÷ ${a+b} = ${nf(ans)} วัน`,'กลับเศษเป็นส่วน']],df)}
    case 'interest':{const P=1000*ri(1,50),r=rnd([2,3,4,5,6,8]),t=rnd([2,3,4,5]),y1=P*r/100,a=y1*t;
      return mkMC(`ฝากเงิน ${nf(P)} บาท ได้ดอกเบี้ยเชิงเดียว ${r}% ต่อปี เป็นเวลา ${t} ปี ได้ดอกเบี้ยรวมกี่บาท`,a,[y1,a+P,a*10],[[`ดอกเบี้ย 1 ปี = ${nf(P)} × ${r} ÷ 100 = ${nf(y1)} บาท`,'ร้อยละต่อปี'],[`${t} ปี = ${nf(y1)} × ${t} = ${nf(a)} บาท`,'ดอกเบี้ยเชิงเดียวคูณจำนวนปีได้เลย']],bf)}
    case 'age':{const S=ri(5,15),k=rnd([2,3]),n=ri(2,10),d=(k-1)*(S+n);
      return mkMC(`ปัจจุบันพ่ออายุมากกว่าลูก ${d} ปี อีก ${n} ปีข้างหน้าพ่อจะมีอายุเป็น ${k} เท่าของลูก ปัจจุบันลูกอายุกี่ปี`,S,[S+n,S+k,S-2],[[`ให้ลูกอายุ x ปี พ่ออายุ x + ${d} ปี`,'โจทย์บอกพ่อมากกว่าลูก '+d+' ปี'],[`อีก ${n} ปี: x + ${d+n} = ${k} × (x + ${n})`,'ทั้งคู่อายุเพิ่ม '+n+' ปีเท่ากัน'],[`x + ${d+n} = ${k}x + ${k*n} ย้ายข้างได้ ${d+n-k*n} = ${k-1}x ดังนั้น x = ${S}`,'แก้สมการ']],yf)}
    case 'updown':{const x=rnd([10,20,25,30,40,50]),up=100+x,cut=up*x/100,fin=up-cut,loss=100-fin;
      return mkMCtext(`ราคาสินค้าเพิ่มขึ้น ${x}% แล้วลดลง ${x}% ราคาสุดท้ายเทียบกับราคาเดิมเป็นอย่างไร`,`ลดลง ${nf(loss)}%`,shuffle(['เท่าเดิม',`ลดลง ${x}%`,`เพิ่มขึ้น ${nf(loss)}%`]),[[`สมมติราคาเดิม 100 บาท เพิ่ม ${x}% เป็น ${up} บาท`,'ใช้ 100 เพื่อให้อ่านเป็นร้อยละได้ทันที'],[`ลด ${x}% ของ ${up} คือ ${nf(cut)} บาท เหลือ ${nf(fin)} บาท`,'การลดคิดจากราคาใหม่ ไม่ใช่ราคาเดิม'],[`เทียบกับ 100 บาท ลดลง ${nf(loss)}%`,'เทียบกับราคาเดิม']])}
    case 'pctpct':{const x=rnd([10,20,25,40,50]),y=rnd([10,20,25,40,50]),N=400*ri(1,10),m=N*y/100,a=m*x/100;
      return mkMC(`${x}% ของ ${y}% ของ ${nf(N)} เท่ากับเท่าใด`,a,[N*(x+y)/100,N*x/100,a*10],[[`${y}% ของ ${nf(N)} = ${nf(m)}`,'คิดจากด้านในสุดก่อน'],[`${x}% ของ ${nf(m)} = ${nf(a)}`,'ข้อ 1']])}
  }
}

/* ---------- เงื่อนไขภาษา ---------- */
const NOUNS=['แมว','นก','ปากกา','ต้นไม้','ครู','ดอกไม้','หนังสือ','ปลา','นักร้อง','ผลไม้','ทหาร','รถ','ดินสอ','นักเรียน','ช้าง','เพชร'];
const LG_TYPES={1:['all'],2:['all','all','some'],3:['all','some','none'],4:['all','some','none'],5:['all','some','none','someNot']};
const say={all:(X,Y)=>`ทุก${X}เป็น${Y}`,some:(X,Y)=>`${X}บางส่วนเป็น${Y}`,none:(X,Y)=>`ไม่มี${X}ใดเป็น${Y}`,someNot:(X,Y)=>`${X}บางส่วนไม่เป็น${Y}`};
function holds(type,x,y,m){
  const both=m.some(r=>(r>>x&1)&&(r>>y&1)),xNotY=m.some(r=>(r>>x&1)&&!(r>>y&1));
  return type==='all'?!xNotY:type==='some'?both:type==='none'?!both:xNotY;
}
function genLogic1(level){
  const ns=level>=4?4:3,names=shuffle([...NOUNS]).slice(0,ns),types=LG_TYPES[level];
  const prem=[];for(let i=0;i<ns-1;i++){const t=rnd(types),flip=Math.random()<.5;prem.push({t,x:flip?i+1:i,y:flip?i:i+1})}
  const R=(1<<ns)-1,valid=[];
  for(let mask=1;mask<(1<<R);mask++){
    const m=[];for(let r=1;r<=R;r++)if(mask>>(r-1)&1)m.push(r);
    let ok=true;for(let s=0;s<ns&&ok;s++)if(!m.some(r=>r>>s&1))ok=false;
    if(ok&&prem.every(p=>holds(p.t,p.x,p.y,m)))valid.push(m);
  }
  if(!valid.length)return null;
  const A=0,Z=ns-1,cands=[];
  for(const [x,y] of [[A,Z],[Z,A]])for(const t of ['all','some','none','someNot']){
    const res=valid.map(m=>holds(t,x,y,m)),st=res.every(Boolean)?'T':res.some(Boolean)?'U':'F';
    cands.push({text:say[t](names[x],names[y]),st});
  }
  const T=cands.filter(c=>c.st==='T'),N=shuffle(cands.filter(c=>c.st!=='T')),NONE='ไม่มีข้อใดสรุปได้แน่นอน';
  if(N.length<3)return null;
  let correct,dist;
  if(T.length){correct=rnd(T).text;dist=N.slice(0,3).map(c=>c.text);if(level>=3&&Math.random()<.3)dist[2]=NONE}
  else{if(level<=2&&Math.random()<.6)return null;correct=NONE;dist=N.slice(0,3).map(c=>c.text)}
  const stem=`กำหนดให้\n${prem.map(p=>'• '+say[p.t](names[p.x],names[p.y])).join('\n')}\nข้อใดสรุปได้ถูกต้องแน่นอน`;
  const lab={T:'จริงเสมอ ไม่ว่าจะวาดวงกลมแบบใด',F:'ขัดกับเงื่อนไข',U:'เป็นไปได้ทั้งจริงและไม่จริง จึงสรุปไม่ได้'};
  const steps=[[`วาดวงกลมแทน ${names.join(', ')} แล้วลองจัดวางทุกแบบที่ไม่ขัดกับเงื่อนไข`,'เงื่อนไขในโจทย์'],
    ...[correct,...dist].filter(t=>t!==NONE).map(t=>{const c0=cands.find(c=>c.text===t);return[`${t}: ${lab[c0.st]}`,'ตรวจกับทุกแบบที่วาดได้']}),
    ...(correct===NONE?[['ไม่มีข้อสรุปใดจริงเสมอ คำตอบจึงเป็น ไม่มีข้อใดสรุปได้แน่นอน','ข้อก่อนหน้า']]:[])];
  return mkMCtext(stem,correct,dist,steps);
}
/* ---------- มิติสัมพันธ์: ระบบวาดรูปเองเป็น SVG จึงรู้คำตอบแน่นอน ไม่ต้องใช้ AI ---------- */
const f1=v=>+(+v).toFixed(1);
const svgBox=(w,h,body,lab)=>`<svg class="qsvg" viewBox="0 0 ${f1(w)} ${f1(h)}" width="${f1(w*1.3)}" height="${f1(h*1.3)}" role="img" aria-label="${lab||'รูปประกอบโจทย์'}">${body}</svg>`;
const poly=(ps,cls)=>`<polygon class="${cls}" points="${ps.map(p=>f1(p[0])+','+f1(p[1])).join(' ')}"/>`;
const seqRow=(parts,arrow)=>parts.join(arrow?'<span class="qarrow" aria-hidden="true">→</span>':'');
/* opts[0] is the right answer {svg,txt,...}; steps may be a function of the shuffled options (to name choices by ก ข ค ง) */
function mkPicMC(stem,svg,opts,steps,desc,extra){
  const o=shuffle(opts.map((x,i)=>({...x,ok:i===0})));
  return{kind:'mc',stem,svg,choices:o.map(x=>x.txt),chSvg:o.map(x=>x.svg),answer:o.findIndex(x=>x.ok),steps:typeof steps==='function'?steps(o):steps,desc,...extra};
}

/* 1) นับลูกบาศก์: กองลูกบาศก์มุมมองสามมิติ (มองจากด้านหน้า-บน) ความสูงลดลงเมื่อเข้าหาผู้มอง จึงเห็นยอดทุกกอง ตอบได้แน่นอน */

    if(H[y][x])b+=poly([P(x,y,0),P(x+1,y,0),P(x+1,y+1,0),P(x,y+1,0)],'s ft')+`<text class="tx" x="${f1(cx)}" y="${f1(cy)}">${H[y][x]}</text>`}
  return svgBox((gx+gy)*ISO_A*k+8,(gx+gy)*ISO_B*k+8,b,'จำนวนชั้นของแต่ละกอง มองจากด้านบน');

const CUBE_LV={1:[2,2,2],2:[2,3,3],3:[3,3,3],4:[3,4,4],5:[4,4,4]};
function genCubes(level){
  let [gy,gx,mh]=CUBE_LV[level];if(Math.random()<.5)[gy,gx]=[gx,gy];

  for(let y=0;y<gy;y++){H.push([]);for(let x=0;x<gx;x++){const cap=Math.min(y?H[y-1][x]:mh,x?H[y][x-1]:mh);H[y].push(x+y===0?mh:!cap||(level>=3&&Math.random()<.15)?0:ri(1,cap))}}
  if(H[gy-1].every(v=>!v)||H.every(r=>!r[gx-1]))return null;
  const all=H.flat(),sum=all.reduce((a,b)=>a+b,0);
  let vis=0;for(let y=0;y<gy;y++)for(let x=0;x<gx;x++)for(let z=0;z<H[y][x];z++)
    if(z===H[y][x]-1||x===gx-1||H[y][x+1]<=z||y===gy-1||H[y+1][x]<=z)vis++;
  if(level>=2&&vis===sum)return null;
  const svg=stackSVG(H),ex=stackTopSVG(H),parts=all.filter(Boolean);
  const desc=`กองลูกบาศก์ ${gy}×${gx} ช่อง ความสูงแต่ละกอง (แต่ละแถวคั่นด้วย /): ${H.map(r=>r.join(' ')).join(' / ')} รวม ${sum} ก้อน`;
  const rule='ลูกบาศก์ทุกก้อนขนาดเท่ากัน วางซ้อนกันบนพื้นเรียบ ไม่มีก้อนลอย ก้อนบนต้องมีก้อนรองรับเสมอ';
  const s1=[`มองจากด้านบน นับว่าแต่ละกองซ้อนกันกี่ชั้น (ตัวเลขในรูปเฉลย) ก้อนที่ถูกบังอยู่ข้างใต้หรือข้างหลังต้องนับด้วย`,'ก้อนบนต้องมีก้อนรองรับ'],
    s2=[`รวมทุกกอง ${parts.join(' + ')} = ${sum} ก้อน`,'บวกจำนวนชั้นของทุกกอง'];
  if(level>=3&&Math.random()<.35){

    return{...mkMC(`จากรูป ต้องเติมลูกบาศก์อีกกี่ก้อน จึงจะเป็นทรงสี่เหลี่ยมมุมฉากขนาด ${gx} × ${gy} ก้อน สูง ${mh} ชั้น\n(${rule})`,ans,[full-vis,sum,ans+gx,ans-1,ans+1],
      [s1,s2,[`ทรงสี่เหลี่ยมเต็ม ${gx} × ${gy} × ${mh} = ${full} ก้อน`,'กว้าง × ยาว × สูง'],[`ต้องเติมอีก ${full} − ${sum} = ${ans} ก้อน`,'ทรงเต็มลบที่มีอยู่']]),svg,exSvg:ex,desc};
  }
  return{...mkMC(`จากรูป มีลูกบาศก์ทั้งหมดกี่ก้อน\n(${rule})`,sum,[vis,sum-1,sum+1,sum+2,sum-2],
    [s1,s2,...(vis<sum?[[`ถ้านับเฉพาะก้อนที่มองเห็นจะได้แค่ประมาณ ${vis} ก้อน ซึ่งขาดก้อนที่ถูกบัง`,'ข้อผิดพลาดที่พบบ่อย']]:[])]),svg,exSvg:ex,desc};
}

/* 2) รูปคลี่กล่อง: พับรูปคลี่จริงด้วยการกลิ้งลูกบาศก์ไปบนรูปคลี่ แล้วตรวจด้านตรงข้าม/มุมมองที่เป็นไปได้ */
const SYM=['<circle cx=".5" cy=".5" r=".2" class="ink"/>','<circle cx=".5" cy=".5" r=".25" class="sym" vector-effect="non-scaling-stroke"/>',
  '<circle cx=".5" cy=".5" r=".27" class="sym" vector-effect="non-scaling-stroke"/><circle cx=".5" cy=".5" r=".09" class="ink"/>',
  '<path d="M.5 .2V.8M.2 .5H.8" class="sym" vector-effect="non-scaling-stroke"/>','<rect x=".3" y=".3" width=".4" height=".4" class="ink"/>',
  '<rect x=".26" y=".26" width=".48" height=".48" class="sym" vector-effect="non-scaling-stroke"/>'];
const SYMN=['วงกลมทึบ','วงกลมโปร่ง','วงกลมซ้อนจุด','เครื่องหมายบวก','สี่เหลี่ยมทึบ','สี่เหลี่ยมโปร่ง'];
const NET_LET=['A','B','C','D','E','F'];
function netList(){
  const L=[];for(let a=0;a<4;a++)for(let b=0;b<4;b++)L.push([[a,0],[0,1],[1,1],[2,1],[3,1],[b,2]]);

}
const NETS=netList();
/* lay the cube on cell 0 and roll it across the net: the face touching each cell is the face that cell becomes.
   The printed side faces out, which is the mirror of rolling, so up/down normals are swapped. x=east y=north z=up */
const NET_NORM={D:[0,0,1],U:[0,0,-1],N:[0,1,0],S:[0,-1,0],E:[1,0,0],W:[-1,0,0]};
const NET_ROLL={E:s=>({...s,D:s.E,E:s.U,U:s.W,W:s.D}),W:s=>({...s,D:s.W,W:s.U,U:s.E,E:s.D}),S:s=>({...s,D:s.S,S:s.U,U:s.N,N:s.D}),N:s=>({...s,D:s.N,N:s.U,U:s.S,S:s.D})};
function foldNet(cells){
  const at=new Map(cells.map((p,i)=>[p[0]+','+p[1],i])),face=cells.map(()=>null),st=[];
  st[0]={D:'D',U:'U',N:'N',S:'S',E:'E',W:'W'};face[0]='D';const q=[0];
  while(q.length){const i=q.shift(),[c,r]=cells[i];
    for(const [d,dx,dy] of [['E',1,0],['W',-1,0],['S',0,1],['N',0,-1]]){const j=at.get((c+dx)+','+(r+dy));if(j==null||face[j])continue;st[j]=NET_ROLL[d](st[i]);face[j]=st[j].D;q.push(j)}}
  return new Set(face).size===6&&face.every(Boolean)?face.map(f=>NET_NORM[f]):null;
}
const vdot=(a,b)=>a[0]*b[0]+a[1]*b[1]+a[2]*b[2],vcross=(a,b)=>[a[1]*b[2]-a[2]*b[1],a[2]*b[0]-a[0]*b[2],a[0]*b[1]-a[1]*b[0]],veq=(a,b)=>a.every((v,i)=>v===b[i]);
function netSVG(cells,lab,sym){
  const C=34,W=Math.max(...cells.map(p=>p[0]))+1,H=Math.max(...cells.map(p=>p[1]))+1;let b='';
  cells.forEach(([c,r],i)=>{const x=4+c*C,y=4+r*C;b+=`<rect class="s ft" x="${x}" y="${y}" width="${C}" height="${C}"/>`;
    b+=sym?`<g transform="matrix(${C} 0 0 ${C} ${x} ${y})">${SYM[lab[i]]}</g>`:`<text class="tx big" x="${x+C/2}" y="${y+C/2}">${NET_LET[lab[i]]}</text>`});
  return svgBox(W*C+8,H*C+8,b,'รูปคลี่ของกล่องลูกบาศก์');

/* one cube from the front-top corner: top face, left face (normal +x), right face (normal +y) */
function cubeViewSVG(t,l,r){
  const k=2.2,P=isoMap(1,1,k),sub=(a,b)=>[a[0]-b[0],a[1]-b[1]];
  const face=(o,u,v,cls,s)=>{const U=sub(u,o),V=sub(v,o),D=[o[0]+U[0]+V[0],o[1]+U[1]+V[1]];
    return poly([o,u,D,v],'s '+cls)+`<g transform="matrix(${f1(U[0])} ${f1(U[1])} ${f1(V[0])} ${f1(V[1])} ${f1(o[0])} ${f1(o[1])})">${SYM[s]}</g>`};
  return svgBox(2*ISO_A*k+8,2*ISO_B*k+ISO_C*k+8,face(P(0,0,1),P(1,0,1),P(0,1,1),'ft',t)+face(P(1,0,1),P(1,1,1),P(1,0,0),'fl',l)+face(P(0,1,1),P(1,1,1),P(0,1,0),'fr',r),'ลูกบาศก์');
}
function genNet(level){
  let cells=rnd(NETS).map(p=>p.slice());
  const tf=ri(0,7);cells=cells.map(([x,y])=>{let a=tf&4?[y,x]:[x,y];if(tf&1)a[0]=-a[0];if(tf&2)a[1]=-a[1];return a});
  const mx=Math.min(...cells.map(p=>p[0])),my=Math.min(...cells.map(p=>p[1]));cells=cells.map(([x,y])=>[x-mx,y-my]);

  const lab=shuffle([0,1,2,3,4,5]),normOf=id=>nrm[lab.indexOf(id)],opp=id=>lab[nrm.findIndex(n=>vdot(n,normOf(id))===-1)];
  const pairs=[];for(let i=0;i<6;i++){const o=opp(i);if(i<o)pairs.push([i,o])}

  if(!view){
    const X=ri(0,5),ans=opp(X),others=shuffle([0,1,2,3,4,5].filter(i=>i!==X&&i!==ans)).slice(0,3);
    return{...mkMCtext(`จากรูปคลี่ เมื่อพับเป็นกล่องลูกบาศก์ (ตัวอักษรอยู่ด้านนอก) ด้านใดอยู่ตรงข้ามกับด้าน ${NET_LET[X]}`,NET_LET[ans],others.map(i=>NET_LET[i]),
      [[`พับรูปคลี่ในใจ: ช่องที่อยู่ติดกับ ${NET_LET[X]} ในรูปคลี่จะเป็นด้านข้างของมัน ส่วนช่องที่อยู่ในแถวเดียวกันโดยเว้นหนึ่งช่องจะอยู่ตรงข้ามกัน`,'หลักการพับรูปคลี่'],
       [`พับแล้วได้คู่ด้านตรงข้าม 3 คู่: ${pairs.map(([a,b])=>NET_LET[a]+'–'+NET_LET[b]).join(', ')}`,'พับครบทุกด้าน'],[`ด้านตรงข้ามกับ ${NET_LET[X]} จึงเป็น ${NET_LET[ans]}`,'ข้อ 2']]),
      svg:netSVG(cells,lab,false),desc:`รูปคลี่ ${cells.map((p,i)=>`${NET_LET[lab[i]]}@(${p})`).join(' ')} คู่ตรงข้าม ${pairs.map(([a,b])=>NET_LET[a]+'–'+NET_LET[b]).join(', ')}`};
  }
  const good=[],mirror=[],opps=[];
  for(let t=0;t<6;t++)for(let l=0;l<6;l++)for(let r=0;r<6;r++){if(t===l||l===r||t===r)continue;
    const T=normOf(t),L=normOf(l),R=normOf(r);
    if(vdot(T,L)||vdot(L,R)||vdot(T,R))opps.push([t,l,r]);else(veq(vcross(L,R),T)?good:mirror).push([t,l,r])}
  const ans=rnd(good),same=mirror.filter(m=>new Set([...m,...ans]).size===3);
  let dist=level>=5?shuffle(same.slice()):level===4?[...shuffle(same).slice(0,2),...shuffle(mirror.filter(m=>!same.includes(m))).slice(0,1)]:[...shuffle(mirror).slice(0,2),rnd(opps)];
  dist=dist.slice(0,3);if(dist.length<3)return null;
  const nm=i=>SYMN[i],why=([t,l,r])=>{const T=normOf(t),L=normOf(l),R=normOf(r);
    if(vdot(T,L)||vdot(L,R)||vdot(T,R)){const [a,b]=vdot(T,L)?[t,l]:vdot(L,R)?[l,r]:[t,r];return `มี${nm(a)}กับ${nm(b)} ซึ่งเป็นด้านตรงข้ามกัน จึงมองเห็นพร้อมกันไม่ได้`}
    return veq(vcross(L,R),T)?`พับได้จริง: บน${nm(t)} ซ้าย${nm(l)} ขวา${nm(r)}`:'สามด้านนี้อยู่ติดกันจริง แต่เรียงกลับด้าน (เป็นภาพสะท้อน) พับจริงไม่ได้'};
  const opt=v=>({svg:cubeViewSVG(...v),txt:`บน ${nm(v[0])} · ซ้าย ${nm(v[1])} · ขวา ${nm(v[2])}`,v});
  return mkPicMC('จากรูปคลี่ เมื่อพับเป็นกล่องลูกบาศก์ (ลวดลายอยู่ด้านนอก) ข้อใดเป็นกล่องที่พับได้จากรูปคลี่นี้',netSVG(cells,lab,true),[opt(ans),...dist.map(opt)],
    o=>[[`หาคู่ด้านตรงข้ามก่อน: ${pairs.map(([a,b])=>nm(a)+' – '+nm(b)).join(', ')} คู่ตรงข้ามจะไม่มีทางเห็นพร้อมกัน`,'พับรูปคลี่'],
      [`ที่มุมที่เห็น 3 ด้าน อ่านวนตามเข็มนาฬิกา บน → ขวา → ซ้าย ต้องได้ ${nm(ans[0])} → ${nm(ans[2])} → ${nm(ans[1])} (หรือเริ่มที่ด้านอื่นแต่วนลำดับเดียวกัน)`,'ลำดับรอบมุมของกล่องที่พับจริง'],
      ...o.map((x,j)=>[`${TH[j]}. ${why(x.v)}`,'ตรวจทีละตัวเลือก'])],
    `รูปคลี่ลวดลาย ${cells.map((p,i)=>`${nm(lab[i])}@(${p})`).join(' ')} คู่ตรงข้าม ${pairs.map(([a,b])=>nm(a)+'–'+nm(b)).join(', ')}`);
}

/* 3) หมุนรูป/ภาพสะท้อน: รูปต่อจากช่องสี่เหลี่ยมที่ไม่สมมาตร ทั้ง 8 แบบ (หมุน 4 × พลิก 2) ต่างกันหมด */
const shpN=c=>{const mx=Math.min(...c.map(p=>p[0])),my=Math.min(...c.map(p=>p[1]));return c.map(([x,y,m])=>[x-mx,y-my,m])};
const shpK=c=>shpN(c).map(p=>p.join(',')).sort().join(';');
const shpRot=c=>c.map(([x,y,m])=>[-y,x,m]),shpFlip=c=>c.map(([x,y,m])=>[-x,y,m]);
const shpRotN=(c,n)=>{for(let i=0;i<n;i++)c=shpRot(c);return shpN(c)};
function shapeSVG(c,mirror){
  c=shpN(c);const C=20,W=Math.max(...c.map(p=>p[0]))+1,H=Math.max(...c.map(p=>p[1]))+1;
  let b=c.map(([x,y,m])=>`<rect class="s ft" x="${4+x*C}" y="${4+y*C}" width="${C}" height="${C}"/>${m?`<circle class="ink" cx="${4+x*C+C/2}" cy="${4+y*C+C/2}" r="5"/>`:''}`).join('');
  if(mirror)b+=`<path class="s ln dash acc" d="M${W*C+16} 2V${H*C+6}"/><text class="tx sm" x="${W*C+16}" y="${H*C+16}">กระจก</text>`;

function genRot(level){

  let c=[...s].map(t=>[...t.split(',').map(Number),0]);if(mark)c[ri(0,c.length-1)][2]=1;c=shpN(c);
  if(Math.max(...c.map(p=>p[0]))>3||Math.max(...c.map(p=>p[1]))>3)return null;
  const R=[0,1,2,3].map(n=>shpRotN(c,n)),M=[0,1,2,3].map(n=>shpRotN(shpFlip(c),n));
  if(new Set([...R,...M].map(shpK)).size!==8)return null;
  const RN=['รูปเดิม','หมุนตามเข็ม 90°','หมุน 180°','หมุนทวนเข็ม 90°'],MN=['พลิกซ้าย–ขวา (ภาพในกระจก)','พลิกแล้วหมุนตามเข็ม 90°','พลิกบน–ล่าง','พลิกแล้วหมุนทวนเข็ม 90°'];
  const opR=n=>({svg:shapeSVG(R[n]),txt:RN[n],why:RN[n]}),opM=n=>({svg:shapeSVG(M[n]),txt:MN[n],why:MN[n]+' ไม่ใช่การหมุน'});
  const tip=['หาจุดเด่นของรูป เช่น ส่วนที่ยื่นออกมา'+(mark?' หรือช่องที่มีจุด':'')+' แล้วดูว่าหลังหมุนต้องไปอยู่ตรงไหน','หลักการหมุนรูป'];

  const per=o=>o.map((x,j)=>[`${TH[j]}. ${x.why}`,'ตรวจทีละตัวเลือก']);

      try{const t=await keyCallOnce(prov,model,input,json,signal);LAST_MODEL=model;return t}
      catch(e){lastErr=e;
        if(e.code==='overloaded'||e.code==='network'&&attempt===0){await sleep(1500*(attempt+1),signal);continue}
        if(e.code==='bad_model'||(e.code==='rate_limited'&&prov==='gemini'))break;

}
async function keyCallOnce(prov,model,input,json,signal){
  const turns=normTurns(input);let res;
  try{
    if(prov==='gemini'){
      res=await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${encodeURIComponent(model)}:generateContent`,{method:'POST',signal,
        headers:{'Content-Type':'application/json','x-goog-api-key':AIP.gemini.key},
        body:JSON.stringify({contents:turns.map(t=>({role:t.role==='assistant'?'model':'user',parts:typeof t.content==='string'?[{text:t.content}]:[{text:t.content.text},...t.content.images.map(i=>({inline_data:{mime_type:i.mime,data:i.data}}))]})),...(json?{generationConfig:{responseMimeType:'application/json'}}:{})})});
    }else{
      res=await fetch('https://api.openai.com/v1/chat/completions',{method:'POST',signal,
        headers:{'Content-Type':'application/json','Authorization':'Bearer '+AIP.openai.key},
        body:JSON.stringify({model,messages:turns.map(t=>typeof t.content==='string'?t:{role:t.role,content:[{type:'text',text:t.content.text},...t.content.images.map(i=>({type:'image_url',image_url:{url:`data:${i.mime};base64,${i.data}`}}))]}),...(json?{response_format:{type:'json_object'}}:{})})});
    }
  }catch(e){if(e&&e.name==='AbortError')throw{code:'cancelled'};throw{code:'network',message:String(e)}}
  if(!res.ok)await httpFail(res);
  const d=await res.json();
  const text=prov==='gemini'?((d.candidates&&d.candidates[0]&&d.candidates[0].content&&d.candidates[0].content.parts)||[]).map(x=>x.text||'').join(''):(d.choices&&d.choices[0]&&d.choices[0].message&&d.choices[0].message.content)||'';
  if(!text.trim())throw{code:'empty_completion'};
  return text;
}
function looseJSON(t){
  try{return JSON.parse(t)}catch(e){}
  const f=t.match(/```(?:json)?\s*([\s\S]*?)```/);if(f){try{return JSON.parse(f[1])}catch(e){}}
  const a=Math.min(...['{','['].map(ch=>{const i=t.indexOf(ch);return i<0?Infinity:i})),b=Math.max(t.lastIndexOf('}'),t.lastIndexOf(']'));
  if(isFinite(a)&&b>a){try{return JSON.parse(t.slice(a,b+1))}catch(e){}}
  throw{code:'invalid_json',text:t};
}

function givenHTML(x){return `<div class="given"><span class="k">ถ้า</span><span class="eq">${esc(`${c(x.k,x.X)} > ${x.H} > ${x.M} ≯ ${x.R} + ${x.S}`)} &nbsp;<span class="k">และ</span></span><span></span><span class="eq">${esc(`${x.X} = ${x.Y} > ${x.Q} > ${FR[x.k]}${x.H}`)}</span><span class="note">ทุกตัวอักษรมีค่ามากกว่าศูนย์</span></div>`}

  const ch=[c(x.k,x.X),c(x.k,x.Y),c(x.k,x.Q),x.H,x.M,`${x.R}+${x.S}`],ops=['=','>','>','>','≯'];
  const lo=hl?Math.min(...hl):-1,hi=hl?Math.max(...hl):-1;let h='';
  ch.forEach((v,i)=>{const cls=!hl?'':(hl.includes(i)?' hl':(i>lo&&i<hi?'':' dim'));h+=`<span class="chip${cls}">${esc(v)}</span>`;
    if(i<ops.length){const oc=!hl?'':(i>=lo&&i<hi?' hl':' dim');h+=`<span class="op${oc}">${esc(ops[i])}</span>`}});

  if(q.cite)h+=`<p class="cite">📄 อ้างอิง: ${esc(q.cite)}${q.by?` · อัปโหลดโดย ${esc(q.by)}`:''}</p>`;
  if(typeof cloudCardOf==='function'&&cloudCardOf(q))h+=`<div><button class="ghost" type="button" data-rpt="${esc(q.card)}">⚑ รายงานเฉลยผิด</button></div>`;

function rulesFor(q,pick){
  let ctx;
  if(q.kind==='ineq'){const x=q.ctx;ctx=`โจทย์:\nบรรทัดบน: ${c(x.k,x.X)} > ${x.H} > ${x.M} ≯ ${x.R} + ${x.S}\nบรรทัดล่าง: ${x.X} = ${x.Y} > ${x.Q} > ${FR[x.k]}${x.H}\nทุกตัวอักษรมีค่ามากกว่าศูนย์ (≯ แปลว่า ไม่มากกว่า)\nแถวรวม (คูณ ${x.k} ทุกตัวในบรรทัดล่างแล้วต่อตรง ${x.H}): ${c(x.k,x.X)} = ${c(x.k,x.Y)} > ${c(x.k,x.Q)} > ${x.H} > ${x.M} ≯ ${x.R} + ${x.S}\nข้อสรุปที่ถาม: ${q.text}\nความหมาย: จริง = โจทย์ยืนยันว่าถูก, ไม่จริง = โจทย์ยืนยันว่าผิด, สรุปไม่ได้ = โจทย์ไม่ได้ยืนยันทั้งสองทาง`}
  else if(q.kind==='ineq2')ctx=`โจทย์ (เงื่อนไขสัญลักษณ์):\n${q.lines.map((l,i)=>`บรรทัดที่ ${i+1}: ${l}`).join('\n')}\nทุกตัวอักษรมีค่ามากกว่าศูนย์ (≯ แปลว่า ไม่มากกว่า, ≮ แปลว่า ไม่น้อยกว่า)\n${q.fmt==='tfu'?`ข้อสรุปที่ถาม: ${q.text}\nความหมาย: จริง = โจทย์ยืนยันว่าถูก, ไม่จริง = โจทย์ยืนยันว่าผิด, สรุปไม่ได้ = โจทย์ไม่ได้ยืนยันทั้งสองทาง`:`คำถาม: ข้อใดสรุปได้ถูกต้องแน่นอน\nตัวเลือก: ${q.choices.map((t,j)=>`${TH[j]}. ${t}`).join(' | ')}`}\nคำตอบถูกตรวจด้วยการคำนวณทางคณิตศาสตร์แล้ว ถูกต้องแน่นอน`;
  else ctx=`วิชา: ${q.subName||subj().name}${q.topic&&q.topic!==q.subName?` (หัวข้อ ${q.topic})`:''}\nโจทย์: ${q.stem}${q.desc?`\nรูปประกอบ (ระบบวาดเองจากข้อมูลนี้ เฉลยคำนวณจากข้อมูลจริง): ${q.desc}`:''}\nตัวเลือก: ${q.choices.map((t,j)=>`${TH[j]}. ${t}`).join(' | ')}`;
  return `คุณคือติวเตอร์ข้อสอบราชการไทย กำลังช่วยนักเรียนที่เพิ่งตอบข้อนี้

${ctx}
เฉลยที่ถูกต้อง: ${q.choices[q.answer]}
เหตุผลในเฉลย: ${q.steps.map(s=>s[0]).join(' / ')}
นักเรียนตอบว่า: ${pick==null?'ไม่ได้ตอบ':q.choices[pick]}
${q.srcText?`
เนื้อหาจากเอกสารอ้างอิง [${q.cite}]:
${q.srcText}
`:''}
วิธีตอบ:
${q.srcText?`- อธิบายโดยอิงเนื้อหาจากเอกสารอ้างอิงข้างบนเป็นหลัก ปิดท้ายทุกคำตอบด้วยบรรทัด "อ้างอิง: ${q.cite}" ถ้าเอกสารไม่ได้พูดถึงสิ่งที่ถาม ให้บอกตรงๆ ว่าเอกสารไม่ได้ระบุ\n`:isSpecSub(q.sub)||(q.subName&&SPEC.some(x=>x[1]===q.subName))?'- ปิดท้ายทุกคำตอบด้วยบรรทัด "อ้างอิง: " ตามด้วยชื่อกฎหมาย มาตรา หรือหลักการที่ใช้ และบอกว่าไม่ได้มาจากเอกสารในคลังความรู้\n':''}
- ตอบเป็นภาษาไทย สั้น กระชับ ไม่เกินประมาณ 8 บรรทัด ภาษาพูดง่ายๆ
- ห้ามใช้ markdown เช่น ** หรือ # หรือตาราง ถ้าแบ่งขั้นให้ขึ้นบรรทัดใหม่ขึ้นต้นด้วย ① ② ③
- ห้ามข้ามขั้น ทุกครั้งที่มีค่าหรือพจน์ที่ไม่ได้อยู่ในโจทย์ตรงๆ ต้องบอกว่ามาจากไหน
- ถ้าเฉลยถูกต้อง และนักเรียนแย้ง ให้ชี้อย่างสุภาพว่าเหตุผลพลาดตรงไหน ถ้าตรวจแล้วพบว่าเฉลยผิดจริง ให้ยอมรับตรงๆ และบอกคำตอบที่ถูก
- ไม่ต้องแทนตัวเลขสมมติ เว้นแต่นักเรียนขอ
- ถ้าคำถามไม่เกี่ยวกับข้อนี้ ตอบสั้นๆ แล้วชวนกลับมาที่ข้อนี้`;
}
function wireAsk(id,q,pick){
  const box=document.getElementById('ab-'+id);if(!box||box.dataset.w)return;box.dataset.w='1';
  const thread=box.querySelector('.thread'),form=box.querySelector('form'),inp=box.querySelector('textarea'),send=box.querySelector('.send'),stop=box.querySelector('.stop'),note=box.querySelector('.asknote');
  let RULES=rulesFor(q,pick),turns=[],ctl=null;
  /* questions without their own source: pull related knowledge cards (meaning-based) on the first question asked */
  let ctxDone=!!q.srcText||!CARDS.length;
  const bubble=(cls,t)=>{const d=document.createElement('div');d.className='msg '+cls;d.textContent=t;thread.append(d);return d};
  async function ask(text){
    text=text.trim();if(!text||!activeAI()||send.disabled)return;
    note.textContent='';bubble('me',text);turns.push({role:'user',content:text});turns=turns.slice(-10);
    const b=bubble('ai wait','กำลังคิด...');ctl=new AbortController();send.disabled=true;stop.hidden=false;
    try{
      if(!ctxDone){ctxDone=true;try{const hits=await searchCards(`${q.stem||qLabel(q)}\n${text}`,4);
        if(hits.length)RULES+=`\n\nความรู้จากคลังความรู้ที่อาจเกี่ยวข้อง (ใช้เฉพาะถ้าเกี่ยวข้องจริง ถ้าใช้ให้ปิดท้ายด้วย "อ้างอิง:" ตามด้วยป้ายในวงเล็บเหลี่ยม):\n${hits.map(c=>`[${cardCite(c)}] ${c.title}: ${c.fact}`).join('\n')}`}catch(e){}}
      let first=RULES;if(q.fig&&canVision()){const im=await figForAI(q.fig);if(im)first={text:RULES+'\n\nภาพที่แนบคือรูปประกอบของโจทย์ข้อนี้ ดูรูปจริงก่อนตอบ',images:[im]}}
      const t=await aiText([{role:'user',content:first},...turns],{signal:ctl.signal,onText:({text})=>{b.classList.remove('wait');b.textContent=text}});
      b.classList.remove('wait');b.textContent=t;turns.push({role:'assistant',content:t});
    }catch(e){
      b.classList.remove('wait');if(e&&e.text)b.textContent=e.text;else b.remove();
      const code=e&&e.code;
      if(HIDE_CODES.includes(code)||code==='no_ai'){box.hidden=true;return}
      note.textContent=code==='cancelled'?'':errCopy(code,'ถาม');
    }finally{send.disabled=false;stop.hidden=true}
  }
  form.onsubmit=e=>{e.preventDefault();const t=inp.value;inp.value='';ask(t)};
  inp.onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey&&!e.isComposing){e.preventDefault();form.requestSubmit()}};
  stop.onclick=()=>ctl&&ctl.abort();
  box.querySelectorAll('.qk').forEach(k=>k.onclick=()=>ask(k.dataset.q));
}

function finish(){
  const n=R.items.length,score=R.items.filter((q,j)=>R.picks[j]===q.answer).length,pct=n?score/n:0;
  const before=R.level;let after=before;if(pct>=.8)after=before+1;else if(pct<.5)after=Math.max(1,before-1);
  P.levels[R.subject]=after;
  const wrong=R.items.filter((q,j)=>R.picks[j]!==q.answer).map(q=>qLabel(q).replace(/\s+/g,' ').slice(0,90));
  P.weak[R.subject]=[...(P.weak[R.subject]||[]),...wrong].slice(-5);if(!wrong.length)P.weak[R.subject]=[];
  save();Object.assign(R,{status:'done',score,pct,after});recordCards(R.items,R.picks);awardPoints(roundPoints(R.items,R.picks,before));
  const sn=(SUBJ.find(s=>s.id===R.subject)||subj()).name,t0=R.t0||Date.now();
  addHist({at:t0,kind:'practice',title:`ฝึก · ${sn}`,n,score,pct,used:(Date.now()-t0)/1000,groups:[{name:sn,ok:score,n}],viol:0,auto:''});
  render();
}
function verdict(p){
  if(p===1)return{s:'🏆',c:'good',t:'เต็ม! สุดยอดมาก',m:'ทำถูกครบทุกข้อ ความแม่นระดับนี้พร้อมลงสนามจริงแล้ว รอบหน้าระบบจะเพิ่มความยาก เตรียมตัวให้ดี'};
  if(p>=.8)return{s:'🎉',c:'good',t:'เก่งมาก ผ่านเกณฑ์',m:'ถูกเกิน 80% แล้ว รักษามาตรฐานนี้ไว้ รอบหน้าจะยากขึ้นอีกขั้น'};
  if(p>=.6)return{s:'💪',c:'mid',t:'ใช้ได้ แต่ยังไม่พอ',m:'อีกนิดเดียวก็ถึง 80% อ่านเฉลยข้อที่พลาดให้เข้าใจ แล้วลุยรอบใหม่'};

/* ---------- chunked AI generation (max 20 per request so 50–100 ข้อ ไม่ขาดกลางทาง) ---------- */
async function genAIChunks(promptFn,n,{signal,onProg}={}){
  const out=[],seen=new Set();let fails=0;
  while(out.length<n&&fails<3){
    const k=Math.min(20,n-out.length),base=out.length;let items;
    try{const pr=await promptFn(k,base);items=cleanAI(typeof pr!=='string'?await aiVisionJSON(pr.text,pr.images,{signal}):await aiJSON(pr,{signal,onText:({text})=>{const m=(text.match(/"stem"/g)||[]).length;if(onProg)onProg(base+Math.min(m,k))}}))}
    catch(e){if(e&&e.code==='invalid_json'){fails++;continue}throw e}
    let add=0;for(const q of shuffle(items))if(out.length<n&&!seen.has(q.stem)){seen.add(q.stem);out.push(q);add++}
    if(!add)fails++;if(onProg)onProg(out.length);
  }
  return out;
}

/* ---------- knowledge base: documents → AI reads (OCR for broken PDF pages) → knowledge cards → embeddings ----------
   Everything lives in IndexedDB on this device: docs (text per page), files (original PDF bytes), cards (digested knowledge). */
var DOCS=[],CARDS=[],DOC_OFF=0,UPQ=[],KB_ERR=false,PROCQ=[],PROC_ID=null;
const KB_OPEN=new Set(),FIGS=new Map();
const newId=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
function kbOpen(){return new Promise((ok,no)=>{const r=indexedDB.open('exam-kb',3);
  r.onupgradeneeded=()=>{const db=r.result;for(const s of ['docs','files','cards','images'])if(!db.objectStoreNames.contains(s))db.createObjectStore(s,{keyPath:'id'})};
  r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)})}
async function kbTx(store,mode,fn){
  const db=await kbOpen();
  return new Promise((ok,no)=>{const tx=db.transaction(store,mode),q=fn(tx.objectStore(store));let res;
    if(q&&typeof q==='object'&&'onsuccess' in q)q.onsuccess=()=>{res=q.result};
    tx.oncomplete=()=>{db.close();ok(res)};tx.onerror=tx.onabort=()=>{db.close();no(tx.error)}});
}
const kbAll=s=>kbTx(s,'readonly',st=>st.getAll());
const kbGet=(s,id)=>kbTx(s,'readonly',st=>st.get(id));
const kbPutMany=(s,arr)=>kbTx(s,'readwrite',st=>{for(const x of arr)st.put(x)});
const kbDelMany=(s,ids)=>kbTx(s,'readwrite',st=>{for(const id of ids)st.delete(id)});

const canvasBlob=(cv,type,q)=>new Promise(ok=>cv.toBlob(ok,type,q));
/* crop part of a rendered page: box is [ymin,xmin,ymax,xmax] on a 0–1000 scale */
async function cropFig(cv,box){
  let [y0,x0,y1,x1]=box.map(v=>Math.max(0,Math.min(1000,+v)));if(!(y1>y0&&x1>x0))[y0,x0,y1,x1]=[0,0,1000,1000];
  const pad=15;y0=Math.max(0,y0-pad);x0=Math.max(0,x0-pad);y1=Math.min(1000,y1+pad);x1=Math.min(1000,x1+pad);
  const sx=Math.round(x0/1000*cv.width),sy=Math.round(y0/1000*cv.height),w=Math.max(8,Math.round((x1-x0)/1000*cv.width)),h=Math.max(8,Math.round((y1-y0)/1000*cv.height));
  const o=document.createElement('canvas');o.width=w;o.height=h;o.getContext('2d').drawImage(cv,sx,sy,w,h,0,0,w,h);
  let b=await canvasBlob(o,'image/png');if(b.size>700*1024)b=await canvasBlob(o,'image/jpeg',.88);
  return{blob:b,mime:b.type,w,h};
}
/* re-encode any stored image as PNG/JPEG (max 1600px) so every AI provider accepts it */
async function figForAI(id){
  if(!FIGS.has(id)&&CFIG.has(id))await fetchCloudFig(id);
  const f=FIGS.get(id);if(!f)return null;

      return{id:newId(),docId:doc.id,type:'q',no:String(q.no||''),title:q.stem.trim().slice(0,90),topic:topicsOf(doc.group).includes(q.topic)?q.topic:'อื่นๆ',kind:'ข้อสอบ',
        fact:`${q.stem.trim()}\nตัวเลือก: ${choices.join(' | ')}${ans>=0?`\nตอบ: ${choices[ans]}`:''}`,page:pages.includes(+q.page)?+q.page:pages[0],imp:2,at:Date.now(),st:{},
        figs,ansSrc:ans<0?'':String(q.answerSource||'').includes('เอกสาร')?'doc':'AI',q:{stem:q.stem.trim(),choices,answer:ans,steps,viz:cleanViz(q.viz)}}});
    CARDS.push(...arr);await saveCards(arr);
    doc.digDone=i+1;await saveDoc(doc);
  }
}
async function findConflicts(doc){
  const mine=CARDS.filter(c=>c.docId===doc.id&&c.emb&&c.type!=='q'),others=CARDS.filter(c=>c.docId!==doc.id&&c.emb&&c.type!=='q');
  if(!mine.length||!others.length)return;
  const pairs=[];
  for(const c of mine){let best=null,bs=0;for(const o of others){if(o.em!==c.em)continue;const s=dot(c.emb,o.emb);if(s>bs){bs=s;best=o}}
    if(best&&bs>=(c.em.startsWith('o:')?.7:.85))pairs.push({c,o:best,s:bs})}
  pairs.sort((a,b)=>b.s-a.s);
  for(let i=0;i<Math.min(pairs.length,60);i+=30){
    const ch=pairs.slice(i,i+30);
    const r=await aiJSON(`เทียบบัตรความรู้เป็นคู่ คู่ละ 2 ใบ ใบ "เดิม" มาจากเอกสารที่มีอยู่แล้ว ใบ "ใหม่" มาจากเอกสารที่เพิ่งเพิ่ม
ตอบว่าแต่ละคู่ขัดแย้งกันไหม ขัดแย้ง = พูดถึงเรื่องเดียวกันแต่ตัวเลข เงื่อนไข หรือข้อสรุปต่างกันจนใช้ตอบข้อสอบข้อเดียวกันได้คำตอบต่างกัน
ถ้าแค่เสริมกัน พูดคนละแง่ หรือเป็นคนละเรื่อง ให้ตอบ false
${ch.map((p,j)=>`คู่ ${j}:\nเดิม (${cardCite(p.o)}): ${p.o.fact}\nใหม่ (${cardCite(p.c)}): ${p.c.fact}`).join('\n\n')}
ตอบเป็น JSON เท่านั้น: {"results":[{"i":0,"conflict":false,"note":"ถ้าขัดกัน บอกสั้นๆ ว่าต่างกันตรงไหน"}]}`);
    const changed=[];
    for(const x of (r&&Array.isArray(r.results)?r.results:[])){const p=ch[+x.i];if(p&&x.conflict===true){p.c.conf={other:p.o.id,note:String(x.note||''),use:'new'};changed.push(p.c)}}
    await saveCards(changed);
  }
}

async function handleFiles(files,opt){
  files=[...files];if(!files.length)return;
  if(VIEW!=='kb')setView('kb');
  if(!opt){
    if(await modal(`<p class="mt">อัปโหลด ${files.length} ไฟล์</p><p class="src">${esc(files.map(f=>f.name).join(', ')).slice(0,200)}</p>${docOptHTML(P.upGroup||'spec',!!P.upShow,P.upKind||'kb')}`,[{t:'ยกเลิก'},{t:'อัปโหลด',cls:'primary'}])!==1)return;
    opt=readDocOpt();P.upGroup=opt.group;P.upShow=opt.show;P.upKind=opt.kind;save();
  }
  for(const f of files){
    const job={name:f.name,msg:'กำลังอ่านไฟล์...'};UPQ.push(job);renderKB();
    try{
      const r=await readFile(f,(i,n)=>{job.msg=`อ่านแล้ว ${i} จาก ${n} หน้า`;const e=document.querySelector(`[data-job="${UPQ.indexOf(job)}"]`);if(e)e.textContent=job.msg});
      const old=DOCS.find(d=>d.name===f.name&&!d.central);
      if(old){const ids=CARDS.filter(c=>c.docId===old.id).map(c=>c.id);CARDS=CARDS.filter(c=>c.docId!==old.id);try{await kbDelMany('cards',ids)}catch(e){}await dropFigs(docFigs(old.id).map(f=>f.id));DOCS.splice(DOCS.indexOf(old),1)}
      const doc={id:old?old.id:newId(),name:f.name,type:r.ext,size:f.size,at:Date.now(),unit:r.unit,pages:r.pages,chars:r.chars,bad:r.bad||[],group:opt.group,show:opt.show,kind:opt.kind||'kb',noShare:!!opt.noShare,
        figPages:r.figPages||[],stage:(r.bad&&r.bad.length)||(r.figPages&&r.figPages.length)?'ocr':'digest',ocrDone:[],digDone:0,summ:[],err:'',
        warn:r.figSkipped?`มีรูป ${r.figSkipped} รูปที่ระบบแสดงไม่ได้ (เช่น EMF/WMF หรือรูปที่ลิงก์ไว้นอกไฟล์) ถ้าเป็นรูปโจทย์ แนะนำบันทึกเอกสารเป็น PDF แล้วอัปโหลดใหม่`:''};
      if(r.figs&&r.figs.length)await saveFigs(r.figs.map(f=>({...f,docId:doc.id})));
      if(r.buf){
        try{if(navigator.storage&&navigator.storage.persist)await navigator.storage.persist()}catch(e){}
        try{await kbPutMany('files',[{id:doc.id,buf:r.buf}]);doc.fileMB=Math.round(r.buf.byteLength/104857.6)/10}
        catch(e){ /* not enough browser storage for the original: keep the text, skip reading page images */
          if(doc.stage==='ocr'){doc.stage='digest';doc.bad=[];doc.figPages=[]}
          doc.warn=(doc.warn?doc.warn+' · ':'')+'พื้นที่เก็บข้อมูลในเบราว์เซอร์ไม่พอเก็บไฟล์ต้นฉบับ จึงใช้ได้เฉพาะข้อความที่ดึงได้ (AI อ่านภาพหน้าและตัดรูปจาก PDF ไม่ได้) ลองแยกไฟล์เป็นส่วนเล็กลง'}
      }
      await saveDoc(doc);DOCS.push(doc);syncDocSubjects();
      UPQ.splice(UPQ.indexOf(job),1);
      if(activeAI())queueDoc(doc.id);
    }catch(e){job.err=(e&&e.message)||String(e)}
    renderSide();renderKB();
  }
}

/* ---------- sync approved packs into this browser (only what changed since last time) ---------- */
const SYNC_KEY='exam-cloud-sync';
function rebuildCloudIndex(){
  CFIG=new Map();for(const c of CARDS)if(String(c.docId).startsWith('c_'))for(const id of c.figs||[])CFIG.set(id,c.docId.slice(2));
  const have=new Set(DOCS.filter(d=>d.central).map(d=>d.cloudId.replace(/_\d+$/,'')));
  HIDE=new Set(DOCS.filter(d=>!d.central&&d.subId&&have.has(d.subId)).map(d=>d.id));
}
async function applyPack(id,p){
  const docId='c_'+id,old=DOCS.find(d=>d.id===docId),st={};
  for(const c of CARDS)if(c.docId===docId)st[c.id]=c.st;
  const ids=CARDS.filter(c=>c.docId===docId).map(c=>c.id);
  CARDS=CARDS.filter(c=>c.docId!==docId);try{await kbDelMany('cards',ids)}catch(e){}
  if(p.deleted){if(old){DOCS.splice(DOCS.indexOf(old),1);try{await kbDelMany('docs',[docId])}catch(e){}}return}
  const d={id:docId,central:true,cloudId:id,name:p.title+(p.parts>1?` (ส่วนที่ ${p.part})`:''),type:'pack',size:0,at:p.approvedAtMs||Date.now(),unit:p.unit||'หน้า',
    pages:[],chars:0,group:p.group||'spec',show:old?!!old.show:!!p.show,kind:p.kind||'kb',stage:'ready',summ:p.summ||[],owner:p.ownerName||'',figPages:[],bad:[],warn:'',err:''};
  if(old)DOCS.splice(DOCS.indexOf(old),1);DOCS.push(d);await saveDoc(d);
  const cs=(p.cards||[]).map(c=>({...c,docId,st:st[c.id]||{},at:c.at||Date.now()}));
  CARDS.push(...cs);await saveCards(cs);
}
async function syncCentral(force){
  if(CLOUD.syncing)return;CLOUD.syncing=true;
  try{
    const f=await fb();let since=0;try{since=force?0:(+localStorage.getItem(SYNC_KEY)||0)}catch(e){}
    const q=f.fs.query(f.fs.collection(f.db,'kb'),f.fs.where('updatedAt','>',f.fs.Timestamp.fromMillis(since)),f.fs.orderBy('updatedAt'));
    const snap=await f.fs.getDocs(q);let max=since;
    for(const s of snap.docs){const p=s.data();max=Math.max(max,p.updatedAt?p.updatedAt.toMillis():0);await applyPack(s.id,p)}
    try{localStorage.setItem(SYNC_KEY,String(max))}catch(e){}
    CLOUD.ok=true;CLOUD.err='';CLOUD.last=Date.now();
    rebuildCloudIndex();
    if(snap.size){syncDocSubjects();renderSide();toast(`อัปเดตคลังกลางแล้ว ${snap.size} ชุด`)}
  }catch(e){CLOUD.ok=false;CLOUD.err=CLOUD.err||'ซิงก์คลังกลางไม่สำเร็จ'}
  finally{CLOUD.syncing=false;if(VIEW==='kb')renderKB()}
}
/* figures of central packs are downloaded only when a question needs them, then kept in this browser */
const figWait={};
function fetchCloudFig(id){
  if(figWait[id])return figWait[id];
  return figWait[id]=(async()=>{
    try{const f=await fb(),s=await f.fs.getDoc(fsDoc('kbfigs',id));if(!s.exists())return false;const x=s.data();
      const bin=atob(x.data),u8=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u8[i]=bin.charCodeAt(i);
      await saveFigs([{id,docId:'c_'+(x.packId||CFIG.get(id)||''),page:x.page||1,mime:x.mime,blob:new Blob([u8],{type:x.mime}),desc:x.desc||'',at:Date.now()}]);
      document.querySelectorAll(`img[data-cfig="${id}"]`).forEach(im=>{im.src=figURL(id);im.removeAttribute('data-cfig')});return true;
    }catch(e){return false}finally{delete figWait[id]}
  })();
}
/* smaller JPEG for the free database (1 MB per document) */
async function figForCloud(id){
  const f=FIGS.get(id);if(!f)return null;let bmp;try{bmp=await createImageBitmap(f.blob)}catch(e){return null}
  for(const max of [1400,1100,850,650]){
    const sc=Math.min(1,max/Math.max(bmp.width,bmp.height)),cv=document.createElement('canvas');cv.width=Math.round(bmp.width*sc);cv.height=Math.round(bmp.height*sc);
    const ctx=cv.getContext('2d');ctx.fillStyle='#fff';ctx.fillRect(0,0,cv.width,cv.height);ctx.drawImage(bmp,0,0,cv.width,cv.height);
    const d=cv.toDataURL('image/jpeg',.82).split(',')[1];if(d.length<700000)return{mime:'image/jpeg',data:d,desc:f.desc||'',page:f.page||1};
  }
  return null;
}

/* ---------- contribute: send a processed document to the review queue ---------- */
function packCards(d){
  return CARDS.filter(c=>c.docId===d.id).map(c=>{const pg=d.pages.find(p=>p.n===+c.page);
    const o={id:c.id,title:c.title,topic:c.topic,kind:c.kind,fact:c.fact,page:c.page,imp:c.imp||2,figs:c.figs||[],ansSrc:c.ansSrc||'',src:pg&&pg.text?pg.text.slice(0,600):(c.src||'')};
    if(c.type==='q'){o.type='q';o.no=c.no||'';o.q=c.q}return o});
}
async function submitDoc(d,opt={}){
  if(!ME&&(opt.auto||!(await loginDialog())))return;
  const cards=packCards(d);if(!cards.length){toast('ไฟล์นี้ยังไม่มีบัตรความรู้หรือข้อสอบ ให้ประมวลผลก่อน','bad');return}
  if(!opt.auto&&await modal(`<p class="mt">ส่งเข้าคลังกลาง?</p><p>${esc(d.name)} · ${d.kind==='exam'?'ข้อสอบ':'บัตรความรู้'} ${cards.length} ${d.kind==='exam'?'ข้อ':'ใบ'}</p>
    <p class="src">ส่งเฉพาะสิ่งที่ AI ย่อยแล้วและรูปที่ตัดไว้ ไม่ส่งไฟล์ต้นฉบับ ${isReviewerMe()?'คุณเป็นผู้ตรวจ ระบบจะอนุมัติให้ทันที':'ผู้ตรวจจะตรวจก่อนเข้าคลังกลาง แล้วทุกคนจะได้ใช้'}</p>
    <p class="src">ห้ามส่งเอกสารลับหรือข้อมูลส่วนบุคคลของผู้อื่น</p>`,[{t:'ยกเลิก'},{t:'ส่งเข้าคลังกลาง',cls:'primary'}])!==1)return;
  const f=await fb(),id=d.subId||newId();
  setProg(d,'กำลังส่งเข้าคลังกลาง...');
  try{
    const figIds=[...new Set(cards.flatMap(c=>c.figs))].filter(x=>FIGS.has(x)),sent=[];
    for(const [i,fid] of figIds.entries()){setProg(d,`กำลังส่งรูป ${i+1} จาก ${figIds.length}`);const e=await figForCloud(fid);
      if(e){await f.fs.setDoc(fsDoc('subfigs',fid),{...e,packId:id,ownerUid:ME.uid,createdAt:f.fs.serverTimestamp()});sent.push(fid)}}
    cards.forEach(c=>{c.figs=c.figs.filter(x=>sent.includes(x))});
    /* keep each document under the 1 MB Firestore limit */
    const parts=[];let cur=[],size=0;for(const c of cards){const s=JSON.stringify(c).length*1.1;if(cur.length&&size+s>800000){parts.push(cur);cur=[];size=0}cur.push(c);size+=s}if(cur.length)parts.push(cur);
    const ids=[];
    for(const [i,cs] of parts.entries()){
      const pid=i?`${id}_${i+1}`:id;ids.push(pid);
      await f.fs.setDoc(fsDoc('subs',pid),{title:d.name,kind:d.kind||'kb',group:d.group||'spec',show:!!d.show,unit:d.unit,summ:(d.summ||[]).filter(Boolean).slice(0,20),
        cards:cs,count:cs.length,figIds:[...new Set(cs.flatMap(c=>c.figs))],part:i+1,parts:parts.length,ownerUid:ME.uid,ownerName:ME.name,status:'pending',note:'',
        createdAt:f.fs.serverTimestamp(),updatedAt:f.fs.serverTimestamp()});
    }
    Object.assign(d,{subId:id,subParts:ids,subStatus:'pending',shareWait:false});await saveDoc(d);
    if(isReviewerMe()){for(const pid of ids)await approveSub(pid);d.subStatus='approved';await saveDoc(d);await syncCentral()}
    toast(isReviewerMe()?'อนุมัติเข้าคลังกลางแล้ว':'ส่งแล้ว รอผู้ตรวจอนุมัติ');
  }catch(e){toast('ส่งไม่สำเร็จ: '+String(e&&e.code||e&&e.message||e).slice(0,80),'bad')}
  finally{d.prog='';renderKB()}
}

async function approveSub(pid){
  const f=await fb(),s=await f.fs.getDoc(fsDoc('subs',pid));if(!s.exists())return;const p=s.data();
  for(const fid of p.figIds||[]){const x=await f.fs.getDoc(fsDoc('subfigs',fid));

  const {status,note,...pack}=p;
  await f.fs.setDoc(fsDoc('kb',pid),{...pack,approvedBy:ME.name,approvedAtMs:Date.now(),deleted:false,updatedAt:f.fs.serverTimestamp()});

/* ---------- ระดับไม่จำกัด: ระดับของผู้สอบแปลงเป็นความยากของตัวสร้างโจทย์ (1–5) ----------

function levelTxt(l){
  l=Math.max(1,Math.round(+l||1));
  return {1:'ง่าย พื้นฐาน 1 ขั้นตอน',2:'ปานกลาง 2–3 ขั้นตอน มีตัวลวงที่ต้องคิด',3:'ระดับข้อสอบจริง (ก.พ./ธ.ก.ส.) หลายขั้นตอน',4:'ยาก หลายขั้นตอน ผสมหลายหลักการ ตัวลวงแนบเนียน',5:'ยากมาก ระดับแข่งขันสูง ต้องวิเคราะห์ลึก'}[l]
    ||`ยากกว่าระดับ 5 ขึ้นไปอีก (ระดับ ${l}) โจทย์ซับซ้อน 3–5 ขั้นตอน ผสมหลายหลักการในข้อเดียว ตัวลวงใกล้เคียงคำตอบมาก`;
}
function tierMix(level,n){
  const w=level<=1?[[1,1]]:level===2?[[2,1],[3,2]]:level===3?[[3,1],[4,2]]:level===4?[[4,1],[5,2]]:[[5,1]];
  const tot=w.reduce((a,x)=>a+x[1],0),out=w.map(([t,x])=>({t,k:Math.floor(n*x/tot)}));
  let left=n-out.reduce((a,x)=>a+x.k,0);for(let i=out.length-1;left>0;i=(i+out.length-1)%out.length){out[i].k++;left--}
  return out.filter(x=>x.k>0);
}
function localItems(s,level,n){
  const gen=(t,k)=>s.id==='ineq'?genIneq2(t,k):LOCAL[s.id](t,k);
  return shuffle(tierMix(level,n).flatMap(({t,k})=>gen(t,k))).slice(0,n).map(q=>({...q,sub:s.id,subName:s.name}));
}

/* ---------- ทิศทาง (วาดแผนที่เอง เฉลยคำนวณ) ---------- */
const DIR8=['เหนือ','ตะวันออกเฉียงเหนือ','ตะวันออก','ตะวันออกเฉียงใต้','ใต้','ตะวันตกเฉียงใต้','ตะวันตก','ตะวันตกเฉียงเหนือ'];

function dirDist(ans){const o=[(ans+4)%8,(ans+1)%8,(ans+7)%8,(ans+2)%8,(ans+6)%8,(ans+3)%8];return mkMCtext('',DIR8[ans],o.map(i=>DIR8[i]),[])}
function genDir1(t){

  if(kind==='face'){
    let h=ri(0,7);const start=h,nT=t<=1?1:t<=2?2:t<=3?3:4,acts=[],steps=[];
    for(let i=0;i<nT;i++){const deg=t<=2?rnd([90,180]):rnd([45,90,135,180]),cw=Math.random()<.5,d=deg/45*(cw?1:-1);h=(h+d+8)%8;
      acts.push(`หมุน${cw?'ตามเข็มนาฬิกา':'ทวนเข็มนาฬิกา'} ${deg} องศา`);steps.push([`${acts[i]} → หันไปทาง${DIR8[h]}`,`ครั้งที่ ${i+1} (45° = 1 ช่องของทิศ 8 ทิศ)`])}
    const q=dirDist(h);q.stem=`นายเอยืนหันหน้าไปทางทิศ${DIR8[start]} แล้ว${acts.join(' จากนั้น')}\nตอนนี้นายเอหันหน้าไปทางทิศใด`;
    q.steps=[[`เริ่มหันไปทางทิศ${DIR8[start]}`,'โจทย์บอก'],...steps];q.choices=q.choices.map(c=>'ทิศ'+c);q.expViz=null;return q;
  }

    for(const nm of names){for(let g=0;g<40;g++){const p={name:nm,x:ri(0,8),y:ri(0,7)};if(!pts.some(o=>Math.abs(o.x-p.x)<3&&Math.abs(o.y-p.y)<2)){pts.push(p);break}}}
    let A,Bp,d;for(let g=0;g<60;g++){[A,Bp]=shuffle(pts.slice()).slice(0,2);const dx=A.x-Bp.x,dy=A.y-Bp.y;if((dx===0||dy===0||Math.abs(dx)===Math.abs(dy))&&(dx||dy)){d=dirOf(dx,dy);break}}
    if(d==null)return null;
    const askDist=t>=3&&Math.random()<.5;
    if(askDist){
      const trip=[[3,4,5],[6,8,10],[5,12,13]],[a,b,c]=rnd(t>=4?trip:trip.slice(0,1)),S0=pts[0];
      const P2={name:names[1],x:S0.x+a,y:S0.y+(Math.random()<.5?b:-b)};if(Math.abs(P2.y)>14)return null;pts[1]=P2;
      const viz={type:'map',title:'แผนที่',points:pts,path:[],unit:'1 กม.'};
      const q=mkMC(`จากแผนที่ ระยะทางเป็นเส้นตรงจาก${S0.name}ถึง${P2.name}เท่ากับกี่กิโลเมตร`,c,[a+b,c+1,Math.max(a,b),c-1],[[`${P2.name}อยู่ห่างไปทางตะวันออก ${a} ช่อง และ${P2.y>S0.y?'เหนือ':'ใต้'} ${b} ช่อง`,'นับช่องบนแผนที่'],[`ระยะตรง = √(${a}² + ${b}²) = √${a*a+b*b} = ${c} กม.`,'ทฤษฎีบทพีทาโกรัส']],x=>x+' กม.');
      q.viz=viz;return q;
    }
    const q=dirDist(d);q.viz={type:'map',title:'แผนที่',points:pts,path:[],unit:t>=3?'1 กม.':''};
    q.stem=`จากแผนที่ ${A.name}อยู่ทางทิศใดของ${Bp.name}`;q.choices=q.choices.map(c=>'ทิศ'+c);
    q.steps=[[`ยืนที่${Bp.name}แล้วมองไปหา${A.name}: ไปทาง${A.x>Bp.x?'ขวา (ตะวันออก)':A.x<Bp.x?'ซ้าย (ตะวันตก)':'ไม่ไปซ้ายขวา'} ${Math.abs(A.x-Bp.x)} ช่อง และ${A.y>Bp.y?'ขึ้น (เหนือ)':A.y<Bp.y?'ลง (ใต้)':'ไม่ขึ้นลง'} ${Math.abs(A.y-Bp.y)} ช่อง`,'นับช่องบนแผนที่ ทิศเหนืออยู่ด้านบน'],
      [`จึงอยู่ทางทิศ${DIR8[d]}`,'รวมสองทิศ']];
    return q;
  }
  /* walk: absolute legs (tier 1) or relative turns (tier 2+) */
  const legs=t<=1?2:t<=2?3:t<=3?4:5;let h=rnd([0,2,4,6]),x=0,y=0;const path=[[0,0]],txt=[],steps=[];
  for(let i=0;i<legs;i++){
    if(i){const turn=rnd([2,-2]);h=(h+turn+8)%8;txt.push(t<=1?`จากนั้นเดินไปทางทิศ${DIR8[h]}`:`เลี้ยว${turn>0?'ขวา':'ซ้าย'}แล้วเดิน`)}
    else txt.push(`เริ่มเดินไปทางทิศ${DIR8[h]}`);
    const dist=ri(1,6);x+=STEP_V[h][0]*dist;y+=STEP_V[h][1]*dist;path.push([x,y]);
    txt[i]+=` ${dist} กม.`;steps.push([`ช่วงที่ ${i+1}: ไปทาง${DIR8[h]} ${dist} กม. → อยู่ที่ (${x}, ${y})`,'วาดเส้นทางทีละช่วง (x=ตะวันออก, y=เหนือ)'])}
  if(!x&&!y)return null;
  const d=dirOf(x,y);if(!(x===0||y===0||Math.abs(x)===Math.abs(y)))return null;
  const q=dirDist(d);q.stem=`${txt.join(' ')}\nตอนนี้อยู่ทางทิศใดของจุดเริ่มต้น`;q.choices=q.choices.map(c=>'ทิศ'+c);
  q.steps=[...steps,[`จุดสุดท้ายอยู่ที่ (${x}, ${y}) เทียบกับจุดเริ่ม (0, 0) จึงอยู่ทางทิศ${DIR8[d]}`,'ดูเครื่องหมาย x และ y']];
  q.expViz={type:'map',title:'เส้นทางที่เดิน',points:[{name:'เริ่ม',x:0,y:0},{name:'จบ',x,y}],path,unit:''};
  return q;
}
function genDir(level,n){return many(()=>{for(let g=0;g<40;g++){const q=genDir1(level);if(q)return q}return null},n)}

/* ---------- การวิเคราะห์ข้อมูล (ตาราง/กราฟจริง เฉลยคำนวณ) ---------- */
const DSETS=[{cat:'ไตรมาส',labels:['Q1','Q2','Q3','Q4'],what:'ยอดสินเชื่อ',unit:'ล้านบาท'},{cat:'เดือน',labels:['ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.'],what:'จำนวนลูกค้าใหม่',unit:'ราย'},
  {cat:'สาขา',labels:['สาขา ก','สาขา ข','สาขา ค','สาขา ง'],what:'ยอดเงินฝาก',unit:'ล้านบาท'},{cat:'ผลิตภัณฑ์',labels:['ข้าว','ยางพารา','มันสำปะหลัง','อ้อย','ข้าวโพด'],what:'ผลผลิต',unit:'พันตัน'}];
function genData1(t){
  const ds=rnd(DSETS),n=ds.labels.length,base=rnd([20,40,50,100]);
  const vals=ds.labels.map(()=>base*ri(2,12));if(new Set(vals).size<n)return null;
  const chart=t<=1?rnd(['table','bar']):rnd(['table','bar','line']);
  const two=t>=4,y1='ปี 2567',y2='ปี 2568',vals2=two?vals.map(v=>Math.max(base,v+base*ri(-4,5))):null;
  const viz=chart==='table'?{type:'table',title:`${ds.what} (${ds.unit})`,headers:[ds.cat,...(two?[y1,y2]:[ds.what])],rows:ds.labels.map((l,i)=>[l,String(vals[i]),...(two?[String(vals2[i])]:[])])}
    :{type:chart,title:ds.what,labels:ds.labels,series:two?[{name:y1,values:vals},{name:y2,values:vals2}]:[{name:ds.what,values:vals}],unit:ds.unit};
  const kinds=t<=1?['max','sum','diff']:t<=2?['avg','pct','diff','min']:t<=3?['pct','avg','share','pct']:['growth','pct2','share','avg'];
  const k=rnd(kinds),fmtU=x=>nf(x)+' '+ds.unit,lab=i=>ds.labels[i];let q;
  const i1=ri(0,n-2),i2=ri(i1+1,n-1),sum=vals.reduce((a,b)=>a+b,0);
  if(k==='max'||k==='min'){const fn=k==='max'?Math.max:Math.min,v=fn(...vals),i=vals.indexOf(v);
    q=mkMCtext(`จากข้อมูล ${ds.cat}ใดมี${ds.what}${k==='max'?'สูง':'ต่ำ'}ที่สุด`,lab(i),shuffle(ds.labels.filter((_,j)=>j!==i)).slice(0,3),[[`เทียบค่าทุก${ds.cat}: ${ds.labels.map((l,j)=>l+' '+vals[j]).join(', ')}`,'อ่านจากตาราง/กราฟ'],[`${k==='max'?'มากสุด':'น้อยสุด'}คือ ${lab(i)} (${v})`,'เทียบค่า']])}
  else if(k==='sum')q=mkMC(`${ds.what}รวมทุก${ds.cat}เท่ากับเท่าใด`,sum,[sum+base,sum-base,sum+2*base],[[`${vals.join(' + ')} = ${sum}`,'รวมทุกค่า']],fmtU);
  else if(k==='diff'){const d=Math.abs(vals[i2]-vals[i1]);q=mkMC(`${lab(i2)}และ${lab(i1)}มี${ds.what}ต่างกันเท่าใด`,d,[d+base,Math.abs(d-base)||base*3,vals[i2]+vals[i1]],[[`|${vals[i2]} − ${vals[i1]}| = ${d}`,'ลบกัน']],fmtU)}
  else if(k==='avg'){if(sum%n)return null;const a=sum/n;q=mkMC(`${ds.what}เฉลี่ยต่อ${ds.cat}เท่ากับเท่าใด`,a,[a+base/2,a-base/2,sum/(n-1)],[[`รวม ${sum}`,'รวมทุกค่า'],[`${sum} ÷ ${n} = ${a}`,`หารด้วยจำนวน${ds.cat}`]],fmtU)}
  else if(k==='pct'){const p=(vals[i2]-vals[i1])/vals[i1]*100;if(!p||Math.abs(p*4-Math.round(p*4))>1e-9)return null;
    q=mkMC(`${ds.what}ของ${lab(i2)}${p>=0?'เพิ่มขึ้น':'ลดลง'}จาก${lab(i1)}ร้อยละเท่าใด`,Math.abs(p),[Math.abs((vals[i2]-vals[i1])/vals[i2]*100),Math.abs(p)+10,Math.abs(vals[i2]-vals[i1])],[[`ส่วนต่าง ${vals[i2]} − ${vals[i1]} = ${vals[i2]-vals[i1]}`,'ลบกัน'],[`${Math.abs(vals[i2]-vals[i1])} ÷ ${vals[i1]} × 100 = ${nf(Math.abs(p))}%`,'เทียบกับค่าเดิม (ฐาน)']],x=>nf(x)+'%')}
  else if(k==='share'){const p=vals[i1]/sum*100;if(Math.abs(p*4-Math.round(p*4))>1e-9)return null;
    q=mkMC(`${lab(i1)}คิดเป็นร้อยละเท่าใดของ${ds.what}ทั้งหมด`,p,[p+5,100/n,vals[i1]/vals[i2]*100],[[`ทั้งหมด = ${sum}`,'รวมทุกค่า'],[`${vals[i1]} ÷ ${sum} × 100 = ${nf(p)}%`,'ส่วน ÷ ทั้งหมด']],x=>nf(x)+'%')}
  else if(k==='growth'&&two){const g=vals2.map((v,i)=>v-vals[i]),m=Math.max(...g),i=g.indexOf(m);if(g.filter(x=>x===m).length>1)return null;
    q=mkMCtext(`${ds.cat}ใดมี${ds.what}เพิ่มขึ้นจาก ${y1} เป็น ${y2} มากที่สุด (คิดเป็นจำนวน)`,lab(i),shuffle(ds.labels.filter((_,j)=>j!==i)).slice(0,3),[[`ส่วนเพิ่ม: ${ds.labels.map((l,j)=>`${l} ${g[j]>=0?'+':''}${g[j]}`).join(', ')}`,`${y2} − ${y1}`],[`มากที่สุดคือ ${lab(i)}`,'เทียบส่วนเพิ่ม']])}
  else if(k==='pct2'&&two){const s1=vals.reduce((a,b)=>a+b,0),s2=vals2.reduce((a,b)=>a+b,0),p=(s2-s1)/s1*100;if(!p||Math.abs(p*4-Math.round(p*4))>1e-9)return null;
    q=mkMC(`${ds.what}รวม ${y2} ${p>=0?'เพิ่มขึ้น':'ลดลง'}จาก ${y1} ร้อยละเท่าใด`,Math.abs(p),[Math.abs((s2-s1)/s2*100),Math.abs(p)+5,Math.abs(s2-s1)],[[`${y1} รวม ${s1} · ${y2} รวม ${s2}`,'รวมแต่ละปี'],[`|${s2} − ${s1}| ÷ ${s1} × 100 = ${nf(Math.abs(p))}%`,'เทียบกับปีฐาน']],x=>nf(x)+'%')}
  else return null;
  if(two&&k!=='growth'&&k!=='pct2')q.stem=`พิจารณาเฉพาะ${y1} ${q.stem.replace(/^จากข้อมูล /,'')}`;
  q.viz=viz;q.stem=q.stem.startsWith('จากข้อมูล')?q.stem:'จากข้อมูล '+q.stem;return q;
}
function genData(level,n){return many(()=>{for(let g=0;g<60;g++){const q=genData1(level);if(q)return q}return null},n)}
